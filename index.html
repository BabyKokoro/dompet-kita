<style>
:root{
  --bg:#F7EFE6; --surface:#FFFBF6; --surface2:#EFE2D3; --tint:#F3E6D8; --line:#E6D5C3;
  --primary:#8B5E43; --primary-dark:#5C3D2E; --text:#4A3226; --muted:#6E5646;
  --green:#3F6B3A; --green-bg:#E3EEDB; --red:#A6452F; --red-bg:#F8E1DA; --gold:#E3A857;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --on-primary:#FFFFFF; --input:#FFFFFF; --chip-teks:#6E4A34; --hijau-teks:#2F4F2A; --merah-teks:#8A3A28;
  --kuning-bg:#FBE7C6; --kuning-teks:#7A4A10; --garis-tipis:var(--garis-tipis);
  --font-head:"Fredoka","Nunito",ui-rounded,system-ui,sans-serif;
  --font-body:"Nunito",ui-rounded,system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-body);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--font-head);font-weight:600;margin:0;line-height:1.2;color:var(--text)}
h1{font-size:30px} h2{font-size:21px} h3{font-size:18px}
p{margin:0}
button,input,select{font:inherit;color:inherit}
a{color:var(--primary)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
.maskot{display:inline-flex;flex:0 0 auto}
.maskot svg{width:100%;height:100%;display:block}

.card{background:var(--surface);border:2px solid var(--line);border-radius:var(--r-lg);padding:24px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 20px;border-radius:16px;border:2px solid transparent;font-weight:800;font-size:15px;cursor:pointer;text-decoration:none;transition:transform .1s, background .15s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.55;cursor:not-allowed}
.btn-primary{background:var(--primary);color:var(--on-primary)}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--primary-dark)}
.btn-ghost:hover{background:var(--tint)}
.btn-danger{background:var(--red);color:var(--on-primary)}
.btn-lg{min-height:56px;font-size:17px;padding:0 32px}
.link{background:none;border:none;padding:6px;color:var(--primary);font-weight:800;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.chip{display:inline-block;background:var(--tint);color:var(--chip-teks);border-radius:999px;padding:4px 12px;font-size:13px;font-weight:800}
.eyebrow{font-size:14px;font-weight:800;color:var(--primary)}
.muted{color:var(--muted)}
.err{color:var(--red);font-weight:700;font-size:14px;min-height:21px}
.field{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:15px}
.field input,.field select{height:50px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--input);padding:0 14px;font-weight:600;font-size:16px}
.field input:focus,.field select:focus{border-color:var(--primary);outline:none}
.row-btn{display:flex;gap:12px;flex-wrap:wrap;justify-content:flex-end}

/* layar tengah: sambutan, daftar */
.center-screen{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px 16px}
.welcome{max-width:640px;width:100%;text-align:center;display:flex;flex-direction:column;align-items:center;gap:16px;padding:36px 28px}
.geng{display:flex;align-items:flex-end;justify-content:center;gap:2px;flex-wrap:wrap}
.steps{text-align:left;margin:4px 0;padding-left:22px;display:flex;flex-direction:column;gap:6px;font-weight:700}
.note{background:var(--tint);border-radius:var(--r-md);padding:12px 16px;font-size:15px;color:var(--chip-teks)}
.setup{max-width:620px;width:100%;display:flex;flex-direction:column;gap:20px}
.setup-head{display:flex;align-items:center;gap:14px}
.setup form{display:flex;flex-direction:column;gap:18px}
fieldset{border:none;margin:0;padding:0}
legend{font-weight:800;font-size:15px;margin-bottom:8px;padding:0}
.avatar-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.avatar-opt{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;border-radius:var(--r-md);border:3px solid var(--line);background:var(--input);cursor:pointer;font-weight:800;font-size:14px}
.avatar-opt.on{border-color:var(--primary);background:var(--tint)}
.pin-card{max-width:440px;align-items:center;text-align:center}

/* pinpad */
.pin{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.pin-dots{display:flex;gap:14px}
.pin-dots span{width:18px;height:18px;border-radius:50%;border:2px solid var(--primary);transition:background .1s}
.pin-dots span.on{background:var(--primary)}
.pin-msg{min-height:22px;font-weight:700;font-size:14px;color:var(--red);text-align:center}
.pin-msg.ok{color:var(--green)}
.pin-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:300px}
.key{height:58px;border-radius:18px;border:2px solid var(--line);background:var(--input);font-family:var(--font-head);font-size:23px;cursor:pointer;color:var(--text)}
.key:hover{background:var(--tint)}
.key:active{transform:scale(.96)}
.key-soft{font-family:var(--font-body);font-size:15px;font-weight:800;background:var(--bg);color:var(--muted)}
.key-ok{font-family:var(--font-body);font-size:16px;font-weight:800;background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.key-ok:hover{background:var(--primary-dark)}
.pin.busy .pin-keys{opacity:.5;pointer-events:none}
.pin.locked .pin-keys{opacity:.4;pointer-events:none}
.pin.shake .pin-dots{animation:shake .35s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}

/* login */
.login-wrap{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:40px 20px;position:relative;overflow:hidden}
.login-grid{width:100%;max-width:1120px;display:flex;flex-wrap:wrap;gap:28px;align-items:stretch;position:relative;z-index:1}
.login-hero{flex:1.15 1 420px;background:var(--surface2);border-radius:36px;padding:36px 40px;display:flex;flex-direction:column;gap:14px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-head);font-weight:600;font-size:24px;color:var(--primary-dark)}
.login-hero h1{font-size:44px;line-height:1.1}
.login-card{flex:1 1 380px;display:flex;flex-direction:column;align-items:center;gap:16px;border-radius:36px;padding:32px 28px}
.profiles{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.profile{display:flex;flex-direction:column;align-items:center;gap:4px;padding:12px 20px;min-width:128px;border-radius:24px;border:3px solid var(--line);background:var(--surface);cursor:pointer;font-weight:800;font-size:16px}
.profile.on{border-color:var(--primary);background:var(--tint)}
.pin-label{font-weight:800;color:var(--muted)}

/* kerangka aplikasi */
.shell{display:grid;grid-template-columns:264px minmax(0,1fr);gap:24px;padding:24px;min-height:100vh;min-height:100dvh;align-items:start}
.sidebar{background:var(--surface2);border-radius:var(--r-lg);padding:20px;display:flex;flex-direction:column;gap:16px;position:sticky;top:24px}
.userchip{background:var(--surface);border-radius:var(--r-md);padding:10px 12px;display:flex;align-items:center;gap:10px}
.userchip strong{display:block;font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:140px}
.nav{display:flex;flex-direction:column;gap:3px}
.nav-item{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:var(--r-sm);border:none;background:none;text-align:left;font-weight:800;font-size:15px;color:var(--primary-dark);cursor:pointer;width:100%}
.nav-item:hover{background:var(--tint)}
.nav-item.on{background:var(--primary);color:var(--on-primary)}
.ico{width:22px;height:22px;flex:0 0 22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.content{min-width:0;display:flex;flex-direction:column;gap:20px;padding-bottom:24px}
.page-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:14px}
.page-head p{color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.stat{display:flex;flex-direction:column;gap:4px}
.stat .lbl{font-weight:800;font-size:15px}
.stat .val{font-family:var(--font-head);font-weight:600;font-size:30px}
.stat .sub{font-size:14px;color:var(--muted)}
.stat.utama{background:var(--primary);border-color:var(--primary);color:#fff}
.stat.utama .lbl,.stat.utama .sub{color:#F7E6D6}
.bubble-card{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:16px 20px}
.bubble{flex:1 1 280px;background:var(--tint);border-radius:var(--r-md);padding:14px 18px;display:flex;flex-direction:column;gap:2px}
.bubble strong{color:var(--primary-dark)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:16px;align-items:start}
.card-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.list-check{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:8px}
.list-check li{display:flex;gap:10px;align-items:flex-start}
.list-check li::before{content:"";flex:0 0 10px;height:10px;margin-top:7px;border-radius:50%;background:var(--green)}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:40px 24px}
.empty p{max-width:460px;color:var(--muted)}
.set-sec{display:flex;flex-direction:column;gap:16px}
.set-row{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;padding:12px 0;border-top:1px solid var(--garis-tipis)}
.set-row:first-of-type{border-top:none}
.member{display:flex;align-items:center;gap:12px}
.danger{border-color:#EBC3B8}
.geng-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px}
.geng-kartu{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;padding:18px 12px}
.geng-aks{font-size:13px;line-height:1.4}
.geng-tugas{font-size:14px;font-weight:800;line-height:1.4;margin-top:2px}

.bottomnav{display:none}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:var(--primary-dark);color:#fff;padding:12px 20px;border-radius:16px;font-weight:800;opacity:0;pointer-events:none;transition:.25s;z-index:60;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* modal */
.backdrop{position:fixed;inset:0;background:rgba(60,40,28,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.modal{max-width:460px;width:100%;max-height:calc(100dvh - 32px);overflow:auto;display:flex;flex-direction:column;gap:16px;position:relative}
.modal-x{position:absolute;top:12px;right:12px;width:44px;height:44px;border-radius:14px;border:none;background:var(--tint);cursor:pointer;font-size:22px;color:var(--primary-dark)}
.modal.center{align-items:center;text-align:center}
.sheet-list{display:flex;flex-direction:column;gap:4px}

/* langkah 4 */
.modal-lebar{max-width:900px}
.seg-wrap{display:flex;gap:4px;background:var(--surface2);border-radius:18px;padding:5px;flex-wrap:wrap;align-self:flex-start}
.seg{min-height:44px;padding:0 16px;border-radius:14px;border:none;background:transparent;font-weight:800;font-size:14px;color:var(--primary-dark);cursor:pointer}
.seg.on{background:var(--primary);color:var(--on-primary)}
.seg-keluar.on{background:var(--red)} .seg-masuk.on{background:var(--green)}
.tx-form{display:flex;flex-wrap:wrap;gap:22px;align-items:flex-start}
.tx-kiri{flex:1 1 280px;display:flex;flex-direction:column;gap:10px;min-width:0}
.tx-kanan{flex:1.35 1 330px;display:flex;flex-direction:column;gap:14px;min-width:0}
#in-nom{font-family:var(--font-head);font-size:28px;height:64px;text-align:right}
.nom-pratinjau{min-height:22px;text-align:right;font-weight:800;color:var(--muted);margin-top:-4px}
.kalk-head{display:flex;align-items:center;gap:8px;font-weight:800;font-size:14px;color:var(--muted)}
.keypad{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kk{height:50px;border-radius:14px;border:2px solid var(--line);background:var(--input);font-family:var(--font-head);font-size:20px;cursor:pointer;color:var(--text)}
.kk:hover{background:var(--tint)}
.kk:active{transform:scale(.96)}
.kk.op{background:var(--surface2);color:var(--primary-dark)}
.kk.sama{background:var(--primary);border-color:var(--primary);color:var(--on-primary);grid-row:span 2;height:auto}
.kat-grid{display:flex;flex-wrap:wrap;gap:8px}
.kat{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:14px;border:2px solid var(--line);background:var(--input);font-weight:800;font-size:14px;cursor:pointer;color:var(--text)}
.kat:hover{background:var(--tint)}
.kat.on{border-color:var(--primary);background:var(--tint);box-shadow:inset 0 0 0 1px var(--primary)}
.sw{width:12px;height:12px;border-radius:4px;flex:0 0 12px;display:inline-block}
.dua{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
.foto-pilih{display:flex;align-items:center;gap:12px;border:2px dashed #D9BFA6;border-radius:18px;background:var(--bg);padding:10px 14px;cursor:pointer;min-height:64px;position:relative}
.foto-pilih:hover{background:var(--tint)}
.foto-pilih:focus-within{outline:3px solid var(--gold);outline-offset:2px}
.foto-pratinjau{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.foto-pratinjau img{max-width:100%;max-height:170px;border-radius:14px;border:2px solid var(--line);cursor:zoom-in;object-fit:contain;background:var(--bg)}
.foto-pratinjau img.besar{max-height:none;cursor:zoom-out}
.btn-hapus{color:var(--red);border-color:#EBC3B8;margin-right:auto}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.bulan-nav{display:flex;align-items:center;gap:2px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:3px;transition:opacity .2s}
.bulan-nav.redup{opacity:.45}
.bulan-nav button{width:42px;height:42px;border:none;background:none;border-radius:12px;font-size:24px;line-height:1;color:var(--primary-dark);cursor:pointer}
.bulan-nav button:hover{background:var(--tint)}
.bulan-nav span{font-weight:800;padding:0 6px;min-width:136px;text-align:center}
.cari{display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:0 12px;height:52px;flex:1 1 240px}
.cari:focus-within{border-color:var(--primary)}
.cari input{border:none;background:none;outline:none;font-weight:600;width:100%;font-size:15px}
.filter{height:48px;border-radius:14px;border:2px solid var(--line);background:var(--surface);padding:0 12px;font-weight:700;color:var(--primary-dark);max-width:100%;flex:0 1 auto}
.ringkas-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.rchip{border-radius:999px;padding:6px 14px;font-weight:800;font-size:14px}
.tx-list{display:flex;flex-direction:column;gap:16px}
.tgl-grup{display:flex;flex-direction:column;gap:4px}
.tgl-head{display:flex;justify-content:space-between;gap:8px;font-weight:800;font-size:14px;color:var(--muted);padding:0 6px}
.card.tx-card{padding:6px}
.tx{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:none;background:transparent;border-radius:16px;text-align:left;cursor:pointer;color:var(--text)}
.tx:hover{background:var(--tint)}
.tx-ikon{width:42px;height:42px;flex:0 0 42px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-family:var(--font-head);font-weight:600;font-size:18px}
.tx-ikon .ico{width:20px;height:20px}
.tx-teks{flex:1 1 auto;min-width:0;display:flex;flex-direction:column}
.tx-teks strong{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-teks span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-nom{font-weight:800;white-space:nowrap}
.tx-mini{display:flex;flex-direction:column;margin:0 -10px}
.naik{color:var(--green)} .turun{color:var(--red)} .netral{color:var(--primary-dark)}
.donut-wrap{display:flex;flex-wrap:wrap;gap:28px;align-items:center}
.donut{width:210px;height:210px;border-radius:50%;flex:0 0 210px;display:flex;align-items:center;justify-content:center;margin:0 auto}
.donut-hole{width:128px;height:128px;border-radius:50%;background:var(--surface);display:flex;flex-direction:column;align-items:center;justify-content:center}
.donut-hole span{font-size:13px;color:var(--muted)}
.donut-hole strong{font-family:var(--font-head);font-size:19px;font-weight:600}
.legenda{list-style:none;margin:0;padding:0;flex:1 1 300px;display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:4px 22px}
.legenda li{display:flex;align-items:center;gap:10px;padding:7px 0;border-bottom:1px solid var(--garis-tipis)}
.legenda .nm{flex:1 1 auto;font-weight:800;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legenda .nom{font-size:14px;color:var(--muted);white-space:nowrap}
.legenda .pct{font-family:var(--font-head);font-weight:600;min-width:56px;text-align:right}
.dompet-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:14px}
.dompet-kartu{display:flex;flex-direction:column;gap:10px}
.dk-head{display:flex;align-items:center;gap:12px}
.dk-head > div{flex:1 1 auto;min-width:0}
.dk-ikon{width:44px;height:44px;flex:0 0 44px;border-radius:14px;background:var(--tint);color:var(--primary-dark);display:flex;align-items:center;justify-content:center}
.dk-saldo{font-family:var(--font-head);font-weight:600;font-size:26px}
.dk-saldo.minus{color:var(--red)}
.dk-bulan{display:flex;gap:12px;flex-wrap:wrap;font-size:14px;font-weight:700}
.btn-ikon{width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:var(--input);color:var(--primary-dark);display:flex;align-items:center;justify-content:center;cursor:pointer;flex:0 0 44px}
.btn-ikon:hover{background:var(--tint)}
.kat-list{list-style:none;margin:8px 0 12px;padding:0;display:flex;flex-direction:column;gap:2px}
.kat-baris{display:flex;align-items:center;gap:10px;padding:2px 0}
.kat-baris .nm{flex:1 1 auto;font-weight:800;min-width:0}
.kat-jml{font-size:13px;white-space:nowrap}
.warna-grid{display:flex;flex-wrap:wrap;gap:8px}
.warna-opt{width:44px;height:44px;border-radius:12px;border:3px solid transparent;cursor:pointer}
.warna-opt.on{border-color:var(--text);box-shadow:inset 0 0 0 3px #fff}

/* langkah 5 */
.bar{height:12px;background:var(--tint);border-radius:999px;overflow:hidden}
.bar > div{height:100%;border-radius:999px;transition:width .3s}
.bar-wrap{position:relative}
.bar-tanda{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--primary-dark);opacity:.45;border-radius:2px}
.ang-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:14px}
.ang-kartu,.tab-kartu,.dd-kartu{display:flex;flex-direction:column;gap:10px}
.ang-head{display:flex;align-items:center;gap:10px}
.ang-head h3,.ang-head h2{flex:1 1 auto;min-width:0}
.ang-angka{display:flex;align-items:baseline;gap:4px;flex-wrap:wrap}
.ang-angka strong{font-family:var(--font-head);font-weight:600;font-size:22px}
.ang-pct{margin-left:auto;font-family:var(--font-head);font-weight:600;font-size:18px}
.riwayat{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;font-size:14px}
.riwayat li{display:flex;align-items:center;gap:8px;padding:5px 0;border-bottom:1px solid var(--garis-tipis)}
.riwayat li > span:first-child{flex:1 1 auto;min-width:0;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.riwayat li > span:nth-child(2){font-weight:800;white-space:nowrap}
.x-kecil{width:32px;height:32px;flex:0 0 32px;border-radius:10px;border:none;background:none;color:var(--muted);font-size:20px;cursor:pointer}
button.x-kecil:hover{background:var(--red-bg);color:var(--red)}
.panduan{margin:8px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.btn-kecil{min-height:40px;padding:0 12px;font-size:14px;border-radius:12px}
.bagi-list{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.bagi-baris{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:16px;background:var(--bg);flex-wrap:wrap}
.bagi-baris .tx-teks{flex:1 1 220px}
.bagi-baris.lunas{opacity:.65}
.bagi-net{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.preset{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
input[type=range]{width:100%;accent-color:var(--primary);height:32px}
.bagi-hasil{display:flex;flex-wrap:wrap;gap:10px 20px;margin-top:8px}
.bagi-hasil > span{display:flex;align-items:center;gap:8px}
.notif-kartu{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.notif-kartu > div{flex:1 1 280px}
.pilih-mode{display:flex;flex-direction:column;gap:8px}
.pilih-mode label{display:flex;gap:10px;align-items:flex-start;padding:12px;border:2px solid var(--line);border-radius:16px;background:var(--input);cursor:pointer}
.pilih-mode label:has(input:checked){border-color:var(--primary);background:var(--tint)}
.pilih-mode input,.pilih-cek input{width:20px;height:20px;accent-color:var(--primary);margin-top:2px;flex:0 0 20px}
.pilih-cek{display:flex;align-items:center;gap:10px;font-weight:800;min-height:44px}
.uang-pratinjau{font-size:13px;font-weight:700;color:var(--muted);min-height:18px}
.mini-list{display:flex;flex-direction:column;gap:10px}
.mini-baris{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:4px}
.mini-baris > span:first-child{min-width:0}
.mini-baris .maskot{vertical-align:middle}

/* langkah 6 */
.lv-kecil{display:block;font-size:12px;font-weight:800;color:#8B5E43}
.stats-4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stats-4 .val{font-size:25px}
.wawasan{margin:6px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:4px}
.grafik{width:100%;height:auto;display:block;min-width:540px}
.grafik-wrap{overflow-x:auto}
.legenda-kecil{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:13px;font-weight:700;color:var(--muted);margin-top:10px}
.legenda-kecil > span{display:inline-flex;align-items:center;gap:6px}
.kal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;max-width:760px}
.kal-hd{text-align:center;font-size:13px;font-weight:800;color:var(--muted)}
.kal-sel{aspect-ratio:1/0.85;border-radius:12px;border:2px solid transparent;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;cursor:pointer;color:var(--text);padding:2px;min-height:44px}
.kal-sel strong{font-size:14px}
.kal-sel span{font-size:11px;font-weight:700;white-space:nowrap}
.kal-sel.lv1{background:#F3E6D8}.kal-sel.lv2{background:#EBC9A8}.kal-sel.lv3{background:#DDA27A}.kal-sel.lv4{background:#C8614A;color:#fff}
.kal-sel.kini{border-color:var(--primary)}
.kal-sel.nanti{opacity:.4;cursor:default}
.kal-sel:not(.nanti):hover{border-color:var(--gold)}
.kal-cth{width:18px;height:14px;border-radius:4px}
.kal-cth.lv1{background:#F3E6D8}.kal-cth.lv2{background:#EBC9A8}.kal-cth.lv3{background:#DDA27A}.kal-cth.lv4{background:#C8614A}
.tabel-wrap{overflow-x:auto;margin-top:8px}
.tabel{width:100%;border-collapse:collapse;font-size:14px;min-width:460px}
.tabel th{text-align:left;font-size:13px;color:var(--muted);padding:8px;border-bottom:2px solid var(--line)}
.tabel td{padding:8px;border-bottom:1px solid var(--garis-tipis);white-space:nowrap}
.tabel td .maskot{vertical-align:middle}
.cetak-kop{display:none}
.doa{display:flex;flex-direction:column;gap:6px}
.doa-judul{font-weight:800;color:var(--primary-dark);margin-top:6px}
.arab{font-family:"Amiri","Traditional Arabic","Scheherazade New",serif;font-size:28px;line-height:1.9;text-align:right;color:var(--text)}
.arab-kecil{font-size:24px;text-align:center}
.latin{font-style:italic;color:var(--primary-dark);font-weight:600}
.doa .latin:nth-child(2){text-align:center;font-size:14px}
.arti{color:var(--text)}
.sumber{font-size:13px;color:var(--muted);font-weight:700}
.jamal-kartu .doa{background:var(--bg);border-radius:var(--r-md);padding:14px 18px}
.basmalah{text-align:center;color:var(--primary-dark);font-size:14px;font-style:italic;margin-top:-6px}
.basmalah span[lang=ar]{font-family:"Amiri","Traditional Arabic",serif;font-size:20px;font-style:normal}
.kutipan{margin:0;font-family:var(--font-head);font-size:19px;line-height:1.45;color:var(--text);background:var(--bg);border-radius:var(--r-md);padding:14px 18px}
.kutipan cite{display:block;font-family:var(--font-body);font-size:13px;font-style:normal;font-weight:800;color:var(--muted);margin-top:6px}
.level-kartu{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.level-isi{flex:1 1 280px;display:flex;flex-direction:column;gap:6px}
details.card summary{cursor:pointer;min-height:32px;display:flex;align-items:center}
.tangga{list-style:none;margin:12px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.tangga li{display:flex;flex-direction:column;padding:10px 12px;border-radius:14px;background:var(--bg);opacity:.55}
.tangga li.lewat{opacity:1}
.tangga li.kini{opacity:1;background:var(--tint);box-shadow:inset 0 0 0 2px var(--primary)}
.tangga li span{font-size:13px;color:var(--muted);font-weight:700}
.baris-kini td{background:var(--tint);font-weight:800}
.lencana-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:12px}
.lencana{display:flex;gap:14px;align-items:flex-start;padding:16px}
.lencana.belum h3{color:var(--muted)}
.lencana-isi{flex:1 1 auto;min-width:0;display:flex;flex-direction:column;gap:6px}
.lencana-isi h3{font-size:17px}
.lencana-prog{font-size:12px;font-weight:800;color:var(--muted)}
.medali{flex:0 0 auto;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 5px var(--w);display:inline-flex;align-items:center;justify-content:center}
.medali.terkunci .maskot{filter:grayscale(1);opacity:.45}
.tingkat{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.titik{width:14px;height:14px;border-radius:50%;background:#E6DDD3}
.titik.on.t0{background:#C98A5A}.titik.on.t1{background:#AEB6C2}.titik.on.t2{background:#E3B341}.titik.on.ts{background:#D99AA6}
.perayaan .perayaan-kepala{animation:loncat 1s ease-in-out infinite}
@keyframes loncat{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.perayaan-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%}
.perayaan-list li{display:flex;align-items:center;gap:12px;background:var(--bg);border-radius:16px;padding:8px 12px}
@media print{
  @page{margin:14mm}
  body,html{background:var(--input)}
  .sidebar,.bottomnav,.toast,.toolbar,.seg-wrap,.link,.btn,.btn-ikon,.backdrop,.page-head p,.topbar-hp,.jam-pojok{display:none!important}
  .shell{display:block;padding:0}
  .card{border:1px solid #ddd;break-inside:avoid;box-shadow:none}
  .content{gap:12px}
  .cetak-kop{display:block;font-size:13px;border-bottom:2px solid #8B5E43;padding-bottom:8px;margin-bottom:6px}
  .kal-sel{border:1px solid #eee}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* langkah 7A: mode gelap & tambahan */
html[data-tema=gelap]{
  --bg:#1F1612; --surface:#2B201A; --surface2:#352720; --tint:#433126; --line:#4C392D;
  --primary:#D9A77C; --primary-dark:#EBCFB2; --text:#F3E6D8; --muted:#C2AD9C;
  --green:#94C98C; --green-bg:#22301E; --red:#EE937E; --red-bg:#3A231D; --gold:#E3B341;
  --on-primary:#24170F; --input:#241A15; --chip-teks:#EBCFB2; --hijau-teks:#BFE3B5; --merah-teks:#F6BDAE;
  --kuning-bg:#45361C; --kuning-teks:#F2D08A; --garis-tipis:#3A2C23; color-scheme:dark;
}
html[data-tema=gelap] .stat.utama{background:#5C3D2E;border-color:#6B4733}
html[data-tema=gelap] .toast{background:#F3E6D8;color:#24170F}
html[data-tema=gelap] .backdrop{background:rgba(0,0,0,.62)}
html[data-tema=gelap] .bar-tanda{background:var(--text)}
html[data-tema=gelap] .kal-sel.lv1,html[data-tema=gelap] .kal-cth.lv1{background:#4A3628}
html[data-tema=gelap] .kal-sel.lv2,html[data-tema=gelap] .kal-cth.lv2{background:#6B4630}
html[data-tema=gelap] .kal-sel.lv3,html[data-tema=gelap] .kal-cth.lv3{background:#93563A}
html[data-tema=gelap] .titik{background:#4C392D}
html[data-tema=gelap] .warna-opt.on{box-shadow:inset 0 0 0 3px var(--surface)}
html[data-tema=gelap] .pin-dots span.on{background:var(--primary)}
html[data-tema=gelap] .maskot svg{filter:drop-shadow(0 0 1px rgba(243,230,216,.35))}
.btn-tema{gap:6px}
.btn-tema .maskot{margin:-6px 0}
.ulang{display:flex;gap:10px}
.ulang input,.ulang select{height:50px;border-radius:var(--r-sm);border:2px solid var(--line);background:var(--input);padding:0 12px;font-weight:700;font-size:16px}
.ulang input{width:90px}
.ulang select{flex:1 1 auto}
.kat-baru{border-style:dashed;color:var(--primary-dark)}
.usia-teks{font-size:14px;font-weight:700;color:var(--muted)}
.ultah{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px;background:var(--tint)}
.ultah .geng .maskot{animation:loncat 1.2s ease-in-out infinite}
.ultah .geng .maskot:nth-child(2n){animation-delay:.3s}
.tips-usia{font-size:14px;margin:10px 0 4px;color:var(--text)}
.sub-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,260px),1fr));gap:18px}
.sub-grid h3{font-size:16px}
details summary{cursor:pointer;min-height:32px}

/* login B: lengkung senyum + hiasan */
.dekor{position:absolute;inset:0;pointer-events:none;z-index:0}
.blob{position:absolute;border-radius:50%;background:var(--blob)}
.blob-1{width:340px;height:340px;left:-120px;top:-140px}
.blob-2{width:380px;height:380px;right:-140px;bottom:-160px}
.dk{position:absolute}
.dk-koin circle{fill:#F2C94C;stroke:#C9A23A;stroke-width:1.6}
.dk-koin .cincin{fill:none}
.dk-hati path{fill:#F4B6C2}
.dk-bintang path{fill:#E3A857}
.dk-kilau path{fill:#D9A77C}
.hero-atas{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.logo-bulat{width:56px;height:56px;border-radius:50%;background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.tgl-chip{background:var(--surface)}
.sapa{margin-top:8px;font-size:16px}
.hero-desc{font-size:17px;max-width:400px}
.lengkung-sambut{width:100%;max-width:440px}
.kutipan-pil{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:20px;padding:10px 16px;align-self:flex-start;font-style:italic;color:var(--primary-dark);font-size:15px}
.lengkung{position:relative;width:100%;max-width:520px;aspect-ratio:520/240;margin:auto auto 0}
.lengkung-garis{position:absolute;inset:0;width:100%;height:100%}
.lengkung-garis path{fill:none;stroke:#D9BFA6;stroke-width:3;stroke-dasharray:2 10;stroke-linecap:round}
.lk-maskot{position:absolute;aspect-ratio:1}
.lk-maskot .maskot{width:100%!important;height:100%!important}
.lk-bayang{position:absolute;height:5%;border-radius:50%;background:var(--bayang)}
:root{--blob:#F1E4D6;--bayang:#E2D2C0}
html[data-tema=gelap]{--blob:#2A1E18;--bayang:#120D0A}
html[data-tema=gelap] .dk-hati path,html[data-tema=gelap] .dk-kilau path{fill:#FFE58A;opacity:.55}
html[data-tema=gelap] .dk-koin{opacity:.6}
html[data-tema=gelap] .lengkung-garis path{stroke:#6B4E3A}

/* jam real time */
.jam-hidup{display:flex;flex-direction:column;line-height:1.25}
.jam-waktu{font-family:var(--font-head);font-weight:600;font-size:22px;font-variant-numeric:tabular-nums;color:var(--text)}
.jam-tanggal{font-size:13px;font-weight:700;color:var(--muted)}
.jam-sidebar{display:flex;align-items:center;gap:10px;background:var(--surface);border-radius:var(--r-md);padding:8px 12px}
.jam-login{background:var(--surface);border-radius:16px;padding:6px 14px;text-align:right}
.jam-login .jam-waktu{font-size:18px}
.jam-pojok{position:fixed;top:14px;right:14px;z-index:30;display:flex;align-items:center;gap:8px;background:var(--surface);border:2px solid var(--line);border-radius:16px;padding:6px 14px}
.jam-pojok .jam-waktu{font-size:17px}
.topbar-hp{display:none}

.btn-sembunyi{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 12px 4px 6px;border-radius:14px;border:2px solid var(--line);background:var(--surface);color:var(--primary-dark);font-weight:800;font-size:14px;cursor:pointer;width:100%}
.btn-sembunyi:hover{border-color:var(--primary)}
.btn-sembunyi.aktif{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}
.btn-sembunyi.kecil{width:auto;padding:2px;min-height:40px;min-width:40px;justify-content:center}
.topbar-kanan{display:flex;align-items:center;gap:10px}
.pv-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.pv-item{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:2px solid var(--line);border-radius:16px;cursor:pointer}
.pv-item:has(input:checked){border-color:var(--primary);background:var(--tint)}
.pv-item input{width:20px;height:20px;accent-color:var(--primary);margin-top:2px;flex:0 0 20px}
.pv-item > span{display:flex;flex-direction:column;font-size:15px}
.pv-item .muted{font-size:13px;font-weight:600}
.fav-atur li.dicabut{opacity:.6}
.awan-status{display:flex;align-items:center;gap:8px;border:none;background:none;color:var(--muted);font-weight:700;font-size:13px;cursor:pointer;padding:2px 6px;text-align:left}
.awan-status:hover{color:var(--text)}

.lokasi-hp:empty{display:none!important}
@media (max-width:900px){.lokasi-hp{display:block}.lokasi-hp .jam-lokasi{font-size:13px}}
.bio-wadah{display:flex;justify-content:center}
.bio-wadah:empty{display:none}
.btn-bio{gap:8px}
.pulih-baris{align-items:flex-start}
.pulih-kiri{display:flex;gap:12px;align-items:flex-start;min-width:0}
.pulih-status{display:inline-block;font-size:12px;font-weight:800;padding:2px 10px;border-radius:999px;vertical-align:1px}
.pulih-status.siap{background:var(--tint);color:var(--green)}
.pulih-status.belum{background:var(--tint);color:var(--chip-teks)}
.riwayat-pulih{margin:6px 0 0;padding-left:18px;font-size:14px;display:flex;flex-direction:column;gap:6px}
.kode-pulih{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:24px;font-weight:800;letter-spacing:1px;text-align:center;padding:16px 10px;border:2px dashed var(--primary);border-radius:16px;background:var(--tint);margin:12px 0 8px;word-break:break-all;user-select:all}
.modal-pulih{max-width:560px;width:100%}
.tanya-blok{border:2px solid var(--line);border-radius:16px;padding:10px 14px 12px;display:flex;flex-direction:column;gap:8px;margin:0 0 10px}
.tanya-blok legend{font-weight:800;padding:0 6px}
.tanya-blok select,.tanya-blok > input{height:46px;border-radius:14px;border:2px solid var(--line);padding:0 12px;background:var(--input);color:var(--text);font:inherit;font-weight:600}
.pilih-pulih{display:flex;flex-direction:column;gap:8px;width:100%;margin-top:8px}
.opsi-pulih{display:flex;align-items:center;gap:12px;text-align:left;padding:10px 14px;border:2px solid var(--line);border-radius:16px;background:var(--surface);color:var(--text);cursor:pointer;font:inherit}
.opsi-pulih:hover{border-color:var(--primary);background:var(--tint)}
.opsi-pulih > span{display:flex;flex-direction:column;font-size:14px}
.opsi-pulih strong{font-size:16px}
.cetak-kode{display:none}
@media print{
  body.mode-cetak-kode > *:not(.cetak-kode){display:none!important}
  body.mode-cetak-kode .cetak-kode{display:block!important}
  body.mode-cetak-kode .cetak-kode img{width:100%;max-width:700px}
}
/* langkah 13 */
.acara-kartu{gap:8px}
.acara-mini{display:flex;flex-direction:column;gap:6px;padding:8px 0;border-top:1px solid var(--line)}
.acara-mini:first-of-type{border-top:0}
.acara-mini .ang-head{gap:8px;align-items:center}
.acara-lewat summary{cursor:pointer;font-weight:800}
.seg-radio{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:12px;font-weight:800;cursor:pointer}
.seg-radio:has(input:checked){background:var(--primary);color:var(--on-primary)}
.seg-radio input{accent-color:var(--primary)}
.rinci-baris{display:flex;justify-content:space-between;gap:10px;font-size:14px;margin-top:8px}
.modal .bar{width:100%;align-self:stretch;flex:0 0 auto}
.modal .rinci-baris,.modal .rinci-tx{width:100%;align-self:stretch}
.rinci-tx{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:2px}
.rinci-tx li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.rinci-tx li > span:first-child{display:flex;flex-direction:column;min-width:0}
.tx-cek{flex:0 0 26px;width:26px;height:26px;border-radius:8px;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--on-primary);margin-right:2px}
.tx.dipilih{background:var(--tint)}
.tx.dipilih .tx-cek{background:var(--primary);border-color:var(--primary)}
.tx-cek.kunci{border-style:dashed;color:var(--muted)}
.tx-cek.kunci .ico{width:14px;height:14px}
.tx.tx-kunci{opacity:.6}
.bar-pilih{position:fixed;left:50%;transform:translateX(-50%);bottom:20px;z-index:39;display:flex;align-items:center;gap:14px;flex-wrap:wrap;justify-content:space-between;width:min(720px,calc(100% - 32px));padding:10px 14px;border-radius:18px;background:var(--surface);border:2px solid var(--primary);box-shadow:0 10px 28px rgba(60,40,28,.28)}
.bar-pilih-teks{display:flex;flex-direction:column;font-size:14px}
.shell:has(.bar-pilih) .fab-bantu{display:none}
.shell:has(.bar-pilih) .content{padding-bottom:110px}
.snack{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:61;display:flex;align-items:center;gap:14px;padding:10px 12px 10px 18px;border-radius:16px;background:var(--primary-dark);color:#fff;font-weight:800;box-shadow:0 10px 28px rgba(0,0,0,.3);max-width:calc(100% - 32px)}
html[data-tema=gelap] .snack{background:#F3E6D8;color:#24170F}
.snack-btn{border:0;border-radius:12px;padding:8px 14px;font:inherit;font-weight:900;background:var(--gold,#F2C94C);color:#24170F;cursor:pointer}
@media (max-width:900px){
  .bar-pilih{bottom:calc(84px + env(safe-area-inset-bottom))}
  .snack{bottom:calc(100px + env(safe-area-inset-bottom))}
}
/* langkah 14 */
.status-aktif{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--muted)}
.status-aktif i{width:9px;height:9px;border-radius:50%;background:#9A8A7C;display:inline-block}
.status-aktif.on{color:var(--green)}
.status-aktif.on i{background:#4CAF50;box-shadow:0 0 0 3px rgba(76,175,80,.22)}
.status-aktif.redup{font-weight:600;opacity:.75}
.status-pasangan{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px}
.qr-hitung.ok{color:var(--green);font-weight:800}
.modal-undang .qr-wadah,.modal-undang .qr-hitung{align-self:center;text-align:center}
/* langkah 16: obrolan */
.ob-lencana{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:#E0574B;color:#fff;font-size:12px;font-weight:900;display:inline-flex;align-items:center;justify-content:center;line-height:1}
.ob-lencana[hidden]{display:none}
.btn-obrolan-hp .ob-lencana{position:absolute;top:-6px;right:-7px;margin:0;border:2px solid var(--bg)}
.btn-ob{gap:6px}
.ob-kepala{align-items:center}
.ob-judul{display:flex;gap:12px;align-items:center}
.ob-judul h1{display:flex;align-items:center;gap:8px}
.ob-status{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:0}
.ob-ketik{font-size:13px;font-weight:800;color:var(--primary-dark);font-style:italic}
html[data-tema=gelap] .ob-ketik{color:var(--gold)}
.ob-wadah{padding:14px}
.ob-daftar{display:flex;flex-direction:column;gap:6px;min-height:200px}
.ob-memuat{text-align:center;margin:20px 0}
.ob-hari{display:flex;justify-content:center;margin:10px 0 4px}
.ob-hari span{font-size:12px;font-weight:800;padding:3px 12px;border-radius:999px;background:var(--tint);color:var(--chip-teks)}
.ob-baris{display:flex;flex-direction:column}
.ob-baris.saya{align-items:flex-end}
.ob-baris.dia{align-items:flex-start}
.ob-gelembung{max-width:min(78%,520px);padding:8px 12px 6px;border-radius:18px;display:flex;flex-direction:column;gap:6px;word-break:break-word;font-size:15px;line-height:1.45}
.ob-baris.saya .ob-gelembung{background:var(--primary);color:var(--on-primary);border-bottom-right-radius:6px;cursor:pointer}
.ob-baris.dia .ob-gelembung{background:var(--surface);border:2px solid var(--line);border-bottom-left-radius:6px}
.ob-waktu{align-self:flex-end;font-size:11px;font-weight:700;opacity:.75;display:inline-flex;gap:4px;align-items:center}
.ob-centang.dibaca{color:#2F7BD9;opacity:1;font-weight:900}
html[data-tema=gelap] .ob-centang.dibaca{color:#8EC5FF}
.ob-baris.saya .ob-centang.dibaca{color:#1D5FB0}
.ob-dihapus{font-style:italic;opacity:.75}
.ob-menu{margin-top:4px}
.ob-kartu{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:14px;background:var(--surface);color:var(--text);border:2px solid var(--line);text-align:left;min-width:220px}
.ob-kartu > div{display:flex;flex-direction:column;gap:4px;min-width:0;flex:1}
.ob-kartu .muted{font-size:13px}
.ob-kartu .bar{width:100%}
.ob-kartu-nominal{font-weight:900}
.ob-tulis{position:sticky;bottom:0;z-index:20;display:flex;flex-direction:column;gap:8px;padding:10px 0 12px;background:var(--bg)}
.ob-tulis-baris{display:flex;gap:8px;align-items:flex-end}
.ob-tulis textarea{flex:1;min-height:48px;max-height:140px;resize:none;border-radius:16px;border:2px solid var(--line);padding:12px 14px;font:inherit;background:var(--input);color:var(--text)}
.ob-tulis textarea:focus{outline:none;border-color:var(--primary)}
.ob-plus{flex:0 0 48px;height:48px}
.ob-kirim{height:48px}
.ob-lampiran{display:flex;gap:8px;align-items:flex-start}
.ob-lampiran .ob-kartu{flex:1}
.ob-pilih-list{max-height:52vh;overflow:auto}
@media (max-width:900px){
  .ob-tulis{bottom:calc(76px + env(safe-area-inset-bottom));padding-bottom:8px}
  .ob-gelembung{max-width:86%}
  .shell:has(.ob-tulis) .fab-bantu{display:none}
  .topbar-hp .brand{min-width:0}
}
/* 1.5.1: bilah bawah Obrolan + Lingling di kartu saldo + peran Boo */
.lingling-kartu{display:none}
@media (max-width:900px){
  .stat.utama{position:relative}
  .lingling-kartu{display:block;position:absolute;top:12px;right:12px}
}
.bn-ob-ikon{position:relative;display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px}
.bn-ob-ikon .maskot{display:none}
.bn-ob.ada .bn-ob-ikon .ico{display:none}
.bn-ob.ada .bn-ob-ikon .maskot{display:inline-flex;animation:boo-angguk 2.4s ease-in-out infinite}
.bn-ob .ob-lencana{position:absolute;top:-7px;right:-12px;margin:0;border:2px solid var(--bg);min-width:18px;height:18px;font-size:11px}
@keyframes boo-angguk{0%,70%,100%{transform:translateY(0) rotate(0)}78%{transform:translateY(-3px) rotate(-8deg)}86%{transform:translateY(0) rotate(6deg)}}
.ob-penjaga{display:flex;gap:8px;align-items:center;justify-content:center;margin:2px auto 6px;padding:8px 14px;border-radius:14px;background:var(--tint);color:var(--chip-teks);font-size:13px;font-weight:700;max-width:440px;text-align:left}
.ob-ketik-boo{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:800;color:var(--muted)}
.ob-ketik-boo[hidden]{display:none}
.ob-ketik-boo .maskot{animation:boo-angguk 1.2s ease-in-out infinite}
.ob-titik{display:inline-flex;gap:3px}
.ob-titik i{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35;animation:ob-titik 1.2s infinite}
.ob-titik i:nth-child(2){animation-delay:.2s}.ob-titik i:nth-child(3){animation-delay:.4s}
@keyframes ob-titik{0%,60%,100%{opacity:.35;transform:none}30%{opacity:1;transform:translateY(-3px)}}
.ob-baru{align-self:center;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;padding:4px 14px 4px 6px;border-radius:999px;border:2px solid var(--primary);background:var(--surface);color:var(--text);font:inherit;font-size:13px;font-weight:800;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.18)}
.ob-baru[hidden]{display:none}
@media (prefers-reduced-motion:reduce){.bn-ob.ada .bn-ob-ikon .maskot,.ob-ketik-boo .maskot,.ob-titik i{animation:none}}
</style>

/* ============ Kripto (Web Crypto, AES-GCM + PBKDF2) ============ */
const ITERASI = 600000;
const te = new TextEncoder(), td = new TextDecoder();
function keB64(buf){
  const b = new Uint8Array(buf); let s = "";
  for (let i = 0; i < b.length; i += 0x8000) s += String.fromCharCode.apply(null, b.subarray(i, i + 0x8000));
  return btoa(s);
}
function dariB64(str){
  const bin = atob(str), out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function kunciDariPin(pin, salt, iter){
  const dasar = await crypto.subtle.importKey("raw", te.encode(pin), "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2", salt:dariB64(salt), iterations:iter, hash:"SHA-256"},
    dasar, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
const kunciBaru = () => crypto.subtle.generateKey({name:"AES-GCM", length:256}, true, ["encrypt","decrypt"]);
async function enkripsi(key, bytes){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, key, bytes);
  return {iv:keB64(iv), ct:keB64(ct)};
}
async function dekripsi(key, kotak){
  return new Uint8Array(await crypto.subtle.decrypt({name:"AES-GCM", iv:dariB64(kotak.iv)}, key, dariB64(kotak.ct)));
}
async function bungkusKunci(kek, key){ return enkripsi(kek, await crypto.subtle.exportKey("raw", key)); }
async function bukaKunci(kek, kotak){
  return crypto.subtle.importKey("raw", await dekripsi(kek, kotak), {name:"AES-GCM"}, true, ["encrypt","decrypt"]);
}
const enkripsiJson = async (key, obj) => enkripsi(key, te.encode(JSON.stringify(obj)));
const dekripsiJson = async (key, kotak) => JSON.parse(td.decode(await dekripsi(key, kotak)));
const saltBaru = () => keB64(crypto.getRandomValues(new Uint8Array(16)));

/* ============ Pinpad ============ */
let pinAktif = null;
function pinpadHTML(){
  let keys = "";
  for (let i = 1; i <= 9; i++) keys += '<button type="button" class="key" data-k="'+i+'" aria-label="Angka '+i+'">'+i+'</button>';
  keys += '<button type="button" class="key key-soft" data-k="hapus" aria-label="Hapus satu angka">Hapus</button>';
  keys += '<button type="button" class="key" data-k="0" aria-label="Angka 0">0</button>';
  keys += '<button type="button" class="key key-ok" data-k="ok">OK</button>';
  return '<div class="pin"><div class="pin-dots" aria-hidden="true">'+'<span></span>'.repeat(6)+'</div>'+
    '<p class="sr-only pin-sr" aria-live="polite"></p><div class="pin-msg" role="alert"></div><div class="pin-keys">'+keys+'</div></div>';
}
function pasangPinpad(wadah, saatLengkap){
  const el = wadah.querySelector(".pin");
  const titik = [...el.querySelectorAll(".pin-dots span")];
  const msgEl = el.querySelector(".pin-msg"), sr = el.querySelector(".pin-sr");
  let pin = "", sibuk = false, terkunci = false;
  const gambar = () => { titik.forEach((d, i) => d.classList.toggle("on", i < pin.length)); sr.textContent = pin.length + " dari 6 angka"; };
  const api = {
    pesan(t, ok){ msgEl.textContent = t || ""; msgEl.classList.toggle("ok", !!ok); },
    ulang(t){ pin = ""; gambar(); api.pesan(t); el.classList.remove("shake"); void el.offsetWidth; el.classList.add("shake"); },
    kunci(b){ terkunci = b; el.classList.toggle("locked", b); }
  };
  async function kirim(){
    sibuk = true; el.classList.add("busy");
    try { await saatLengkap(pin, api); } finally { sibuk = false; el.classList.remove("busy"); }
  }
  function tekan(k){
    if (sibuk || terkunci) return;
    if (k === "hapus"){ pin = pin.slice(0, -1); gambar(); return; }
    if (k === "ok"){ if (pin.length === 6) kirim(); else api.pesan("PIN harus 6 angka"); return; }
    if (/^\d$/.test(k) && pin.length < 6){
      pin += k; api.pesan(""); gambar();
      if (pin.length === 6) kirim();
    }
  }
  el.addEventListener("click", e => { const b = e.target.closest("[data-k]"); if (b) tekan(b.dataset.k); });
  pinAktif = {el, tekan};
  gambar();
  return api;
}
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && document.querySelector(".backdrop")) { tutupModal(); return; }
  if (!pinAktif || !document.body.contains(pinAktif.el)) return;
  if (e.target.matches("input,textarea,select")) return;
  const modal = document.querySelector(".backdrop");
  if (modal && !modal.contains(pinAktif.el)) return;
  if (/^\d$/.test(e.key)) { pinAktif.tekan(e.key); e.preventDefault(); }
  else if (e.key === "Backspace") { pinAktif.tekan("hapus"); e.preventDefault(); }
  else if (e.key === "Enter") { pinAktif.tekan("ok"); e.preventDefault(); }
});
function pinLemah(p){
  if (/^(\d)\1{5}$/.test(p)) return true;
  const naik = "0123456789012345", turun = "9876543210987654";
  return naik.includes(p) || turun.includes(p);

  const api = pasangPinpad(document.getElementById("app"), async (pin, api) => {

    try {

      try { k = await bukaDenganPin(u, pin); }

        k = await bukaDenganPin(u2, pin); u = u2;
      }
      await masukDenganKunci(u, k);

function modalGantiPin(){
  const alur = {langkah:"lama", baru:""};
  const judul = {lama:"Masukkan PIN lama", baru:"Buat PIN baru", ulang:"Ulangi PIN baru"};
  function tampil(pesan){
    const m = bukaModal(maskot("niko", 76)+'<h2 id="judul-modal">'+judul[alur.langkah]+'</h2>'+pinpadHTML(), "center");
    const api = pasangPinpad(m, async (pin, api) => {
      const u = S.meta.pengguna.find(p => p.id === S.sesi.user.id);
      if (alur.langkah === "lama"){
        try { await bukaDenganPin(u, pin); alur.langkah = "baru"; tampil(); }
        catch(e){ api.ulang("PIN lama salah."); }
        return;
      }
      if (alur.langkah === "baru"){
        if (pinLemah(pin)){ api.ulang("PIN terlalu mudah ditebak."); return; }
        alur.baru = pin; alur.langkah = "ulang"; tampil(); return;
      }
      if (pin !== alur.baru){ alur.langkah = "baru"; alur.baru = ""; tampil("PIN tidak sama. Buat lagi ya."); return; }
      api.pesan("Menyimpan...", true);
      const salt = saltBaru();
      const kek = await kunciDariPin(pin, salt, ITERASI);
      u.salt = salt; u.iterasi = ITERASI;
      u.dek = await bungkusKunci(kek, S.sesi.dek);
      u.bersama = await bungkusKunci(kek, S.sesi.kunciBersama);
      simpanMeta(); S.sesi.user = u; tutupModal(); toast("PIN berhasil diganti.");
      statistik().gantiPin++; await simpanPribadi();
    });
    if (pesan) api.pesan(pesan);
  }
  tampil();
}

function labelTanggal(tgl){

  if (tgl === tglLokal()) return "Hari ini · " + teks;

function ringkas(n){
  if (S.sembunyi && !S.bukaSembunyi) return "Rp •••";
  const a = Math.abs(n), f = (x, d) => x.toLocaleString("id-ID",{maximumFractionDigits:d});
  if (a >= 1e9) return "Rp " + f(n/1e9, 2) + " M";
  if (a >= 1e6) return "Rp " + f(n/1e6, 2) + " jt";
  if (a >= 1e3) return "Rp " + f(n/1e3, 1) + " rb";
  return rupiah(n);
}
function kontras(hex){
  const n = parseInt(hex.slice(1), 16), r = n >> 16 & 255, g = n >> 8 & 255, b = n & 255;
  return (0.299*r + 0.587*g + 0.114*b) / 255 > 0.62 ? "#3B2A20" : "#FFFFFF";
}

/* ---- kalkulator Raku: + − × ÷ dan kurung, hasil dibulatkan ke rupiah ---- */
function hitung(ekspr){
  const s = String(ekspr || "").replace(/\s/g, "")
    .replace(/[.,](?=\d{3}(\D|$))/g, "")
    .replace(/[×xX]/g, "*").replace(/[÷:]/g, "/").replace(/−/g, "-");
  if (!s) return null;
  if (!/^[\d+\-*/()]+$/.test(s)) return NaN;
  let i = 0;
  const lihat = () => s[i];
  function angka(){ const m = s.slice(i).match(/^\d+/); if (!m) throw 0; i += m[0].length; return Number(m[0]); }
  function faktor(){
    if (lihat() === "-"){ i++; return -faktor(); }
    if (lihat() === "("){ i++; const v = jumlah(); if (s[i] !== ")") throw 0; i++; return v; }
    return angka();
  }
  function kali(){ let v = faktor(); while (lihat() === "*" || lihat() === "/"){ const op = s[i++], r = faktor(); v = op === "*" ? v * r : v / r; } return v; }
  function jumlah(){ let v = kali(); while (lihat() === "+" || lihat() === "-"){ const op = s[i++], r = kali(); v = op === "+" ? v + r : v - r; } return v; }
  try { const v = jumlah(); return (i === s.length && isFinite(v)) ? Math.round(v) : NaN; }
  catch(e){ return NaN; }
}

const dompetById = id => S.sesi.data.dompet.find(w => w.id === id);
const urutTx = (a, b) => b.tanggal.localeCompare(a.tanggal) || (b.dibuat || "").localeCompare(a.dibuat || "");
const jumlahPakaiKat = id => S.sesi.data.transaksi.filter(t => t.kategoriId === id).length;
function saldoDompet(id){
  const w = dompetById(id);
  let s = w ? (w.saldoAwal || 0) : 0;
  for (const t of S.sesi.data.transaksi){
    if (t.jenis === "masuk" && t.dompetId === id) s += t.nominal;
    else if (t.jenis === "keluar" && t.dompetId === id) s -= t.nominal;
    else if (t.jenis === "pindah"){ if (t.dompetId === id) s -= t.nominal; if (t.keDompetId === id) s += t.nominal; }
  }
  return s;
}
const totalSaldo = () => S.sesi.data.dompet.reduce((a, w) => a + saldoDompet(w.id), 0);
function ringkasBulan(kb){
  let masuk = 0, keluar = 0, n = 0;
  for (const t of S.sesi.data.transaksi){
    if (periode(t.tanggal) !== kb) continue;
    n++;
    if (t.jenis === "masuk") masuk += t.nominal;
    else if (t.jenis === "keluar") keluar += t.nominal;
  }
  return {masuk, keluar, n};
}
function perKategori(kb, jenis){
  const m = new Map();
  for (const t of S.sesi.data.transaksi){
    if (t.jenis !== jenis || periode(t.tanggal) !== kb) continue;
    m.set(t.kategoriId, (m.get(t.kategoriId) || 0) + t.nominal);
  }
  return [...m.entries()].map(e => {
    const k = kat(e[0]) || {nama:"Tanpa kategori", warna:"#BFA58E"};
    return {nama:k.nama, warna:k.warna, nominal:e[1]};
  }).sort((a, b) => b.nominal - a.nominal);
}
function teksCari(t){
  const k = kat(t.kategoriId), a = dompetById(t.dompetId), b = dompetById(t.keDompetId);
  return [t.catatan, t.sub, k && k.nama, a && a.nama, b && b.nama, t.terkait && t.terkait.label, t.nominal, rupiah(t.nominal),
    t.jenis === "masuk" ? "pemasukan" : t.jenis === "keluar" ? "pengeluaran" : "pindah"].join(" ").toLowerCase();
}

/* ---- tampilan bersama ---- */
function donutHTML(items, label){
  const total = items.reduce((a, b) => a + b.nominal, 0);
  if (!total) return "";
  let acc = 0;
  const stops = items.map(it => {
    const a = acc / total * 360; acc += it.nominal;
    return it.warna + " " + a.toFixed(2) + "deg " + (acc / total * 360).toFixed(2) + "deg";
  });
  const legenda = items.map(it => '<li><span class="sw" style="background:'+it.warna+'"></span><span class="nm">'+esc(it.nama)+'</span>'+
    '<span class="nom">'+rupiah(it.nominal)+'</span><span class="pct">'+(it.nominal / total * 100).toFixed(1).replace(".", ",")+'%</span></li>').join("");
  return '<div class="donut-wrap"><div class="donut" role="img" aria-label="Diagram lingkaran '+esc(label)+'" style="background:conic-gradient('+stops.join(",")+')">'+
    '<div class="donut-hole"><span>Total</span><strong>'+ringkas(total)+'</strong></div></div><ul class="legenda">'+legenda+'</ul></div>';
}
function barisTx(t){
  let judul, sub, warna, isi, kelas, tanda;
  if (t.jenis === "pindah"){
    const lbl = t.terkait ? t.terkait.label : "?";
    const a = t.dompetId ? (dompetById(t.dompetId) || {nama:"?"}).nama : lbl, b = t.keDompetId ? (dompetById(t.keDompetId) || {nama:"?"}).nama : lbl;
    judul = t.catatan || (t.terkait ? t.terkait.label : "Pindah saldo");
    sub = a + " → " + b;
    warna = "#5D6B8C"; isi = ikon("utang"); kelas = "netral"; tanda = "";
  } else {
    const k = kat(t.kategoriId) || {nama:"Tanpa kategori", warna:"#BFA58E"}, w = dompetById(t.dompetId);
    judul = t.catatan || k.nama;
    sub = k.nama + (t.sub ? " · " + t.sub : "") + " · " + (w ? w.nama : "?");
    warna = k.warna; isi = esc(k.nama.charAt(0).toUpperCase());
    kelas = t.jenis === "masuk" ? "naik" : "turun"; tanda = t.jenis === "masuk" ? "+" : "−";
  }
  return awalBarisTx(t)+
    '<span class="tx-ikon" style="background:'+warna+';color:'+kontras(warna)+'">'+isi+'</span>'+
    '<span class="tx-teks"><strong>'+esc(judul)+'</strong><span>'+esc(sub)+(t.valas ? ' · ' + esc(fmtValas(t.valas.jumlah, t.valas.kode)) : '')+(namaAcaraTx(t) ? ' · Acara ' + esc(namaAcaraTx(t)) : '')+(t.fotoId ? ' · ada struk' : '')+'</span></span>'+
    '<span class="tx-nom '+kelas+'">'+tanda+rupiah(t.nominal)+'</span></button>';
}

function hasilTx(){
  const d = S.sesi.data, f = S.filter, cari = f.q.trim().toLowerCase();
  const list = daftarTxTersaring();
  const aktif = cari || f.jenis !== "semua" || f.kategori !== "semua" || f.dompet !== "semua";
  if (!list.length){
    if (aktif) return '<section class="card empty">'+maskot("mochi", 120)+'<h2>Mochi tidak menemukan apa-apa</h2>'+
      '<p>'+(cari ? 'Tidak ada transaksi yang cocok dengan "'+esc(f.q.trim())+'" di semua bulan.' : 'Tidak ada transaksi yang cocok dengan filter di '+labelPeriode(S.bulan)+'.')+'</p>'+
      '<button type="button" class="btn btn-ghost" data-aksi="reset-filter">Hapus pencarian dan filter</button></section>';
    return '<section class="card empty">'+maskot("tupi", 120)+'<h2>Belum ada transaksi di '+labelPeriode(S.bulan)+'</h2>'+
      '<p>Tupi siap mencatat. Tekan tombol di bawah untuk mulai.</p>'+
      '<button type="button" class="btn btn-primary" data-aksi="tx-baru">'+ikon("plus")+'Catat transaksi</button></section>';
  }
  let masuk = 0, keluar = 0;
  const grup = new Map();
  list.forEach(t => {
    if (t.jenis === "masuk") masuk += t.nominal; else if (t.jenis === "keluar") keluar += t.nominal;
    if (!grup.has(t.tanggal)) grup.set(t.tanggal, []);
    grup.get(t.tanggal).push(t);
  });
  let html = '<div class="ringkas-chips">'+(cari ? '<span class="rchip" style="background:var(--tint);color:var(--chip-teks)">Mencari di semua bulan</span>' : '')+
    '<span class="rchip" style="background:var(--green-bg);color:var(--hijau-teks)">Masuk '+rupiah(masuk)+'</span>'+
    '<span class="rchip" style="background:var(--red-bg);color:var(--merah-teks)">Keluar '+rupiah(keluar)+'</span>'+
    '<span class="rchip" style="background:var(--tint);color:var(--chip-teks)">'+list.length+' transaksi</span></div><div class="tx-list">';
  grup.forEach((items, tgl) => {
    const net = items.reduce((a, t) => a + (t.jenis === "masuk" ? t.nominal : t.jenis === "keluar" ? -t.nominal : 0), 0);
    html += '<section class="tgl-grup"><div class="tgl-head"><span>'+labelTanggal(tgl)+'</span><span class="'+(net > 0 ? "naik" : net < 0 ? "turun" : "")+'">'+(net > 0 ? "+" : net < 0 ? "−" : "")+rupiah(Math.abs(net))+'</span></div>'+
      '<div class="card tx-card">'+items.map(barisTx).join("")+'</div></section>';
  });
  return html + '</div>' + barPilih();
}

    S.form = Object.assign({}, t, {baru:false, ekspr:String(t.nominal), fotoBlob:null, hapusFoto:false, catatan:t.catatan || "", valasBuka:!!t.valas, valasDraf:null});
    if (t.jenis !== "pindah") S.form.keDompetId = (d.dompet.find(w => w.id !== t.dompetId) || d.dompet[0]).id;
  } else {
    const a = d.dompet[0], b = d.dompet[1] || d.dompet[0];
    S.form = {id:null, baru:true, jenis:jenisAwal || "keluar", ekspr:"", kategoriId:null, dompetId:a.id, keDompetId:b.id,
      tanggal:tglLokal(), catatan:"", sub:"", fotoId:null, fotoBlob:null, hapusFoto:false};

  tampilFormTx();

function perbaruiPratinjau(){
  const inp = document.getElementById("in-nom"), p = document.getElementById("nom-pratinjau");
  if (!inp || !p) return;
  const v = inp.value.trim();
  if (!v){ p.textContent = ""; return; }
  const h = hitung(v);
  p.textContent = (h == null || isNaN(h)) ? "Format belum lengkap" : (/[+\-×÷*/x:]/.test(v.replace(/^-/, "")) ? "= " : "") + rupiah(h);
}
function tekanKalk(k){
  const inp = document.getElementById("in-nom");
  let v = inp.value;
  if (k === "C") v = "";
  else if (k === "⌫") v = v.slice(0, -1);
  else if (k === "="){ const h = hitung(v); if (h != null && !isNaN(h)) v = String(h); }
  else {
    const op = {"÷":"÷", "×":"×", "−":"-", "+":"+"}[k];
    if (op){
      if (/[+\-×÷*/]$/.test(v)) v = v.slice(0, -1);
      if (v === "" && op !== "-") return;
      v += op;
    } else v += k;
  }
  inp.value = v;
  perbaruiPratinjau();
  document.getElementById("err-tx").textContent = "";
}
async function simpanTx(){
  bacaFormTx();
  const f = S.form, d = S.sesi.data, err = document.getElementById("err-tx");
  const nominal = hitung(f.ekspr);
  if (nominal == null || isNaN(nominal) || nominal <= 0){ err.textContent = "Isi nominal yang benar dulu ya."; return; }
  if (f.jenis !== "pindah" && !f.kategoriId){ err.textContent = "Pilih kategorinya dulu."; return; }
  if (f.jenis === "pindah" && f.dompetId === f.keDompetId){ err.textContent = "Dompet asal dan tujuan harus berbeda."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(f.tanggal)){ err.textContent = "Tanggal belum diisi."; return; }
  const tombol = document.querySelector('[data-aksi="simpan-tx"]');
  tombol.disabled = true;
  try {
    let fotoId = f.hapusFoto ? null : f.fotoId;
    if ((f.hapusFoto || f.fotoBlob) && f.fotoId){ try { await hapusFoto(f.fotoId); } catch(e){} }
    if (f.fotoBlob){ fotoId = uid(); await simpanFoto(fotoId, f.fotoBlob); }
    const sekarang = new Date().toISOString();
    const rec = {id:f.id || uid(), jenis:f.jenis, nominal, kategoriId:f.jenis === "pindah" ? null : f.kategoriId, sub:f.jenis === "pindah" ? "" : (f.sub || "").trim(),
      dompetId:f.dompetId, keDompetId:f.jenis === "pindah" ? f.keDompetId : null, tanggal:f.tanggal,
      catatan:f.catatan.trim(), fotoId, dibuat:f.dibuat || sekarang, diubah:sekarang};
    if (f.jenis !== "pindah" && f.valas){
      rec.valas = {kode:f.valas.kode, jumlah:f.valas.jumlah, kurs:f.valas.kurs};
      (d.pengaturan.kurs = d.pengaturan.kurs || {})[f.valas.kode] = f.valas.kurs;
    }
    if (f.jenis === "keluar" && f.acaraId && cariAcara(f.acaraId, !!f.acaraBersama)){ rec.acaraId = f.acaraId; rec.acaraBersama = !!f.acaraBersama; }
    const acaraLama = rec.acaraId ? cariAcara(rec.acaraId, rec.acaraBersama) : null;
    let acaraSebelum = acaraLama ? totalPakaiAcara(acaraLama, rec.acaraBersama) : 0;
    const lama = d.transaksi.find(t => t.id === rec.id);
    if (acaraLama && lama && lama.acaraId === rec.acaraId && lama.jenis === "keluar") acaraSebelum -= lama.nominal;
    let sebelum = rec.jenis === "keluar" ? terpakai(rec.kategoriId, periode(rec.tanggal)) : 0;
    if (lama && lama.jenis === "keluar" && lama.kategoriId === rec.kategoriId && periode(lama.tanggal) === periode(rec.tanggal)) sebelum -= lama.nominal;
    if (lama && lama.rutinId) rec.rutinId = lama.rutinId;
    if (f.rutinBayar){
      const r = d.rutin.find(x => x.id === f.rutinBayar.id);
      if (r){
        migrasiRutin(r); rec.rutinId = r.id;
        if (!r.dicatatTgl.includes(f.rutinBayar.t)) r.dicatatTgl.push(f.rutinBayar.t);
        if (rutinSelesai(r)) setTimeout(() => toast("Pipo: " + r.nama + " sudah lunas semua!"), 2200);
      }
    }
    if (f.baru && f.simpanFavorit && rec.jenis !== "pindah" && tambahFavorit(rec)) setTimeout(() => toast("Tupi menyimpan favorit baru. Cek tombol Catat cepat di Beranda."), 2600);
    if (f.keinginanId) tandaiDibeli(f.keinginanId, rec);
    if (f.kewajiban) majukanKewajiban(f.kewajiban);
    const i = d.transaksi.findIndex(t => t.id === rec.id);
    if (i >= 0) d.transaksi[i] = rec; else d.transaksi.push(rec);
    await simpanPribadi();
    if (sinkronPakaiBersama(rec)) await simpanBersama();
    cekTeguranKenzo(sebelum, rec);
    cekTeguranCici(rec, acaraSebelum);
    tutupModal();
    S.form = null;
    S.bulan = periode(rec.tanggal);
    render();
    toast(f.baru ? "Transaksi tersimpan!" : "Perubahan tersimpan.");
    if (f.baru && rec.jenis === "masuk" && !saranGajiDova(rec)) tampilDoaMomen("rezeki", "rezeki");
  } catch(e){
    console.error(e);
    err.textContent = "Gagal menyimpan. Coba lagi.";
    tombol.disabled = false;
  }
}

/* ============ Foto struk (IndexedDB, terenkripsi) ============ */
const DB_NAMA = "dompetKita";
let _db = null;
function bukaDB(){
  if (_db) return Promise.resolve(_db);
  return new Promise((res, rej) => {
    const r = indexedDB.open(DB_NAMA, 1);
    r.onupgradeneeded = () => r.result.createObjectStore("foto");
    r.onsuccess = () => { _db = r.result; res(_db); };
    r.onerror = () => rej(r.error);
  });
}
async function idb(mode, fn){
  const db = await bukaDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("foto", mode), req = fn(tx.objectStore("foto"));
    tx.oncomplete = () => res(req && req.result);
    tx.onerror = () => rej(tx.error);
  });
}
const kFoto = id => S.sesi.user.id + ":" + id;
async function simpanFoto(id, blob){
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({name:"AES-GCM", iv}, S.sesi.dek, await blob.arrayBuffer());
  await idb("readwrite", st => st.put({iv, ct}, kFoto(id)));
}
async function muatFoto(id){
  const v = await idb("readonly", st => st.get(kFoto(id)));
  if (!v) return null;
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:v.iv}, S.sesi.dek, v.ct);
  return new Blob([pt], {type:"image/jpeg"});
}
const hapusFoto = id => idb("readwrite", st => st.delete(kFoto(id)));
const hapusFotoPengguna = userId => idb("readwrite", st => st.delete(IDBKeyRange.bound(userId + ":", userId + ":￿")));
function hapusSemuaFoto(){
  if (_db){ _db.close(); _db = null; }
  return new Promise(res => { const r = indexedDB.deleteDatabase(DB_NAMA); r.onsuccess = r.onerror = r.onblocked = () => res(); });
}
async function kompresFoto(file){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const skala = Math.min(1, 1280 / Math.max(img.naturalWidth, img.naturalHeight));
    const c = document.createElement("canvas");
    c.width = Math.round(img.naturalWidth * skala); c.height = Math.round(img.naturalHeight * skala);
    c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
    const blob = await new Promise(res => c.toBlob(res, "image/jpeg", 0.72));
    if (!blob) throw new Error("gagal kompres");
    return blob;
  } finally { URL.revokeObjectURL(url); }
}

async function simpanKat(){
  const d = S.sesi.data, f = S.formKat, err = document.getElementById("err-kat");
  const nama = document.getElementById("in-knama").value.trim();
  if (!nama){ err.textContent = "Isi nama kategori dulu."; return; }
  if (d.kategori.some(k => k.id !== f.id && k.jenis === f.jenis && k.nama.toLowerCase() === nama.toLowerCase())){ err.textContent = "Kategori itu sudah ada."; return; }
  if (f.id) Object.assign(kat(f.id), {nama, warna:f.warna});
  else {
    const baruK = {id:uid(), nama, jenis:f.jenis, warna:f.warna};
    d.kategori.push(baruK);
    if (S.kembaliKeForm && S.form){
      S.kembaliKeForm = false; S.form.kategoriId = baruK.id; S.form.sub = "";
      await simpanPribadi(); tampilFormTx(); toast("Kategori " + nama + " ditambahkan.");
      return;
    }
  }
  await simpanPribadi();
  tutupModal(); render(); toast(f.id ? "Kategori diperbarui." : "Kategori ditambahkan.");
}
async function hapusKat(){
  const d = S.sesi.data, f = S.formKat;
  if (d.kategori.filter(k => k.jenis === f.jenis).length <= 1){ document.getElementById("err-kat").textContent = "Minimal harus ada satu kategori."; return; }
  if (!f.yakin){ f.yakin = true; document.querySelector('[data-aksi="hapus-kat"]').textContent = "Yakin? Klik lagi"; return; }
  if (jumlahPakaiKat(f.id)){
    let tujuan = d.kategori.find(k => k.id !== f.id && k.jenis === f.jenis && k.nama.toLowerCase() === "lainnya");
    if (!tujuan){ tujuan = {id:uid(), nama:"Lainnya", jenis:f.jenis, warna:"#8A7F74"}; d.kategori.push(tujuan); }
    d.transaksi.forEach(t => { if (t.kategoriId === f.id) t.kategoriId = tujuan.id; });
  }
  d.kategori = d.kategori.filter(k => k.id !== f.id);
  if (S.filter.kategori === f.id) S.filter.kategori = "semua";
  await simpanPribadi();
  tutupModal(); render(); toast("Kategori dihapus.");
}

/* ============ 5a. Anggaran (Kenzo) ============ */
function terpakai(kategoriId, kb){
  return S.sesi.data.transaksi.reduce((a, t) => a + (t.jenis === "keluar" && t.kategoriId === kategoriId && periode(t.tanggal) === kb ? t.nominal : 0), 0);
}
function statusAnggaran(pct){
  if (pct >= 100) return {kode:"lewat", label:"Lewat batas", warna:"#C8614A", chip:"background:var(--red-bg);color:var(--merah-teks)"};
  if (pct >= BATAS_AWAS) return {kode:"awas", label:"Hati-hati", warna:"#D98A2B", chip:"background:var(--kuning-bg);color:var(--kuning-teks)"};
  return {kode:"aman", label:"Aman", warna:"#6F8F5E", chip:"background:var(--green-bg);color:var(--hijau-teks)"};
}
function dataAnggaran(kb){
  return S.sesi.data.anggaran.map(a => {
    const k = kat(a.kategoriId);
    if (!k) return null;
    const pakai = terpakai(a.kategoriId, kb), pct = a.batas ? pakai / a.batas * 100 : 0;
    return {a, k, pakai, pct, sisa:a.batas - pakai, st:statusAnggaran(pct)};
  }).filter(Boolean).sort((x, y) => y.pct - x.pct);
}

  const list = dataAnggaran(S.bulan);

    : awas.length ? "Hati-hati di " + awas.map(x => x.k.nama + " (" + Math.round(x.pct) + "%)").join(", ") + ". Rem dulu ya!"

      '<span class="rchip" style="'+x.st.chip+'">'+x.st.label+'</span>'+
      '<button type="button" class="btn-ikon" data-aksi="ubah-anggaran" data-id="'+x.a.id+'" aria-label="Ubah anggaran '+esc(x.k.nama)+'">'+ikon("ubah")+'</button></div>'+
    '<div class="ang-angka"><strong>'+rupiah(x.pakai)+'</strong><span class="muted"> dari '+rupiah(x.a.batas)+'</span><span class="ang-pct">'+Math.round(x.pct)+'%</span></div>'+
    '<div class="bar-wrap">'+bar(x.pct, x.st.warna)+'<span class="bar-tanda" style="left:'+BATAS_AWAS+'%" title="Batas aman 80%"></span></div>'+
    '<p class="muted" style="font-size:14px">'+(x.sisa >= 0 ? "Sisa " + rupiah(x.sisa) + (x.pct < BATAS_AWAS ? " · aman sampai " + rupiah(Math.round(x.a.batas * BATAS_AWAS / 100)) : "") : "Lewat " + rupiah(-x.sisa))+'</p></article>').join("");
  const tanpa = S.sesi.data.kategori.filter(k => k.jenis === "keluar" && !S.sesi.data.anggaran.some(a => a.kategoriId === k.id));

    (list.length && tanpa.length ? '<p class="muted" style="font-size:14px">Belum punya anggaran: '+tanpa.map(k => esc(k.nama)).join(", ")+'.</p>' : "")+seksiAcara();

async function simpanAnggaran(){
  const d = S.sesi.data, err = document.getElementById("err-ang"), batas = nilaiUang("in-abatas");

  const a = S.formAng.id ? d.anggaran.find(x => x.id === S.formAng.id) : null;
  if (a) Object.assign(a, {kategoriId, batas}); else d.anggaran.push({id:uid(), kategoriId, batas});

/* dipanggil setelah transaksi pengeluaran disimpan */
function cekTeguranKenzo(sebelum, rec){
  if (!rec || rec.jenis !== "keluar") return;
  const a = S.sesi.data.anggaran.find(x => x.kategoriId === rec.kategoriId);
  if (!a) return;
  const kb = periode(rec.tanggal), k = kat(rec.kategoriId);
  const pctSesudah = terpakai(rec.kategoriId, kb) / a.batas * 100, pctSebelum = sebelum / a.batas * 100;
  let pesan = "";
  if (pctSesudah >= 100 && pctSebelum < 100) pesan = "Anggaran " + k.nama + " sudah lewat batas (" + Math.round(pctSesudah) + "%).";
  else if (pctSesudah >= BATAS_AWAS && pctSebelum < BATAS_AWAS) pesan = "Anggaran " + k.nama + " sudah terpakai " + Math.round(pctSesudah) + "%. Sisa " + rupiah(a.batas - terpakai(rec.kategoriId, kb)) + ".";
  if (!pesan) return;
  setTimeout(() => toast("Kenzo: " + pesan), 1800);
  kirimNotif("Kenzo si penjaga anggaran", pesan);
}

/* ============ 5b. Tabungan impian & dana darurat ============ */
function rataPengeluaran(){
  const kb = periode(tglLokal()); let s = 0, n = 0;
  for (let i = 0; i < 3; i++){ const r = ringkasBulan(geserBulan(kb, -i)); if (r.keluar){ s += r.keluar; n++; } }
  return n ? Math.round(s / n) : 0;
}
function kartuTabungan(t, target, bersama){
  const saldo = totalSetoran(t), pct = t.target ? saldo / t.target * 100 : 0;

async function simpanMutasi(){
  const f = S.formMut, o = objekMutasi(f.target, f.id), err = document.getElementById("err-mut");
  const nominal = nilaiUang("in-mnom"), tanggal = document.getElementById("in-mtgl").value;
  const catatan = document.getElementById("in-mcat").value.trim();
  const dompetId = f.mode === "pakai" ? null : document.getElementById("in-mdompet").value;
  if (!nominal || isNaN(nominal) || nominal <= 0){ err.textContent = "Isi nominal yang benar."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tanggal)){ err.textContent = "Tanggal belum diisi."; return; }
  if (f.mode !== "setor" && nominal > o.saldo){ err.textContent = "Saldo tidak cukup. Saldo sekarang " + rupiah(o.saldo) + "."; return; }
  let txId = null;
  if (dompetId){
    const terkait = {jenis:f.target, id:f.id, label:o.nama};
    txId = f.mode === "setor" ? buatTxTerkait(dompetId, null, nominal, tanggal, catatan, terkait) : buatTxTerkait(null, dompetId, nominal, tanggal, catatan, terkait);
  }
  const e = {id:uid(), tanggal, nominal:f.mode === "setor" ? nominal : -nominal, catatan, txId, oleh:S.sesi.user.id};
  if (f.mode === "pakai") e.kategori = document.getElementById("in-mkat").value;
  const inAc = document.getElementById("in-macara"); if (f.mode === "pakai" && inAc && inAc.value) e.acaraId = inAc.value;
  if (f.target === "dber"){ e.dompetId = f.id; e.jenis = f.mode; S.sesi.bersama.mutasi.push(e); }
  else o.obj.setoran.push(e);
  await simpanPribadi(); if (o.bersama) await simpanBersama();
  tutupModal(); render();
  toast(f.mode === "setor" ? "Setoran tersimpan!" : f.mode === "ambil" ? "Pengambilan tersimpan." : "Belanja bersama tersimpan.");
  if (f.mode === "setor" && !tampilDoaMomen("setor", "berkah")) sorakEli();
}
async function hapusMutasi(target, id, eid){
  const bersama = target === "tabber" || target === "dber";
  let list;
  if (target === "dber") list = S.sesi.bersama.mutasi;
  else if (target === "darurat") list = S.sesi.data.danaDarurat.setoran;
  else list = (bersama ? S.sesi.bersama.tabungan : S.sesi.data.tabungan).find(x => x.id === id).setoran;
  const i = list.findIndex(e => e.id === eid);
  if (i < 0) return;
  if (bersama && list[i].oleh !== S.sesi.user.id){ toast("Hanya yang mencatat yang bisa menghapus."); return; }
  hapusTxId(list[i].txId);
  list.splice(i, 1);
  await simpanPribadi(); if (bersama) await simpanBersama();
  render(); toast("Catatan dihapus.");
}

/* ============ 5c. Area Bersama + bagi tagihan (Otto) ============ */
function netBagi(){
  const peng = S.meta.pengguna;
  if (peng.length < 2) return null;
  const A = peng[0].id, B = peng[1].id;
  let aKeB = 0;
  S.sesi.bersama.bagiTagihan.filter(x => !x.lunas).forEach(x => {
    if (x.bayarOleh === B) aKeB += x.total * (x.persen[A] || 0) / 100;
    else if (x.bayarOleh === A) aKeB -= x.total * (x.persen[B] || 0) / 100;
  });
  aKeB = Math.round(aKeB);
  if (!aKeB) return {teks:"Impas! Tidak ada yang berutang.", nominal:0};
  return aKeB > 0 ? {dari:A, ke:B, nominal:aKeB, teks:namaPengguna(A) + " perlu bayar " + rupiah(aKeB) + " ke " + namaPengguna(B)}
    : {dari:B, ke:A, nominal:-aKeB, teks:namaPengguna(B) + " perlu bayar " + rupiah(-aKeB) + " ke " + namaPengguna(A)};
}

  const dompet = b.dompet.map(w => {
    const mut = b.mutasi.filter(m => m.dompetId === w.id).sort((x, y) => y.tanggal.localeCompare(x.tanggal)).slice(0, 5);

    return '<article class="card tab-kartu"><div class="ang-head"><span class="dk-ikon">'+ikon("dompet")+'</span><h3>'+esc(w.nama)+'</h3>'+
      '<button type="button" class="btn-ikon" data-aksi="ubah-dber" data-id="'+w.id+'" aria-label="Ubah '+esc(w.nama)+'">'+ikon("ubah")+'</button></div>'+
      '<div class="dk-saldo">'+rupiah(saldoDber(w.id))+'</div>'+
      (riw ? '<ul class="riwayat">'+riw+'</ul>' : '<p class="muted" style="font-size:14px">Belum ada catatan. Mulai dengan setor dari dompet masing-masing.</p>')+
      '<div class="row-btn" style="justify-content:flex-start">'+tombolAksi("mutasi", "Setor", "btn-primary", ' data-t="dber" data-id="'+w.id+'" data-m="setor"')+
        tombolAksi("mutasi", "Belanja", "btn-ghost", ' data-t="dber" data-id="'+w.id+'" data-m="pakai"')+
        tombolAksi("mutasi", "Ambil", "btn-ghost", ' data-t="dber" data-id="'+w.id+'" data-m="ambil"')+'</div></article>';
  }).join("");
  const belum = b.bagiTagihan.filter(x => !x.lunas).sort((x, y) => y.tanggal.localeCompare(x.tanggal));
  const lunas = b.bagiTagihan.filter(x => x.lunas).sort((x, y) => y.tanggal.localeCompare(x.tanggal)).slice(0, 5);
  const baris = x => {

const sisaUtang = u => u.nominal - (u.bayar || []).reduce((a, p) => a + p.nominal, 0);
function halUtang(){
  const d = S.sesi.data, tab = S.tabUtang || "piutang";
  const aktif = d.utang.filter(u => sisaUtang(u) > 0);
  const totPiutang = aktif.filter(u => u.jenis === "piutang").reduce((a, u) => a + sisaUtang(u), 0);
  const totUtang = aktif.filter(u => u.jenis === "utang").reduce((a, u) => a + sisaUtang(u), 0);
  const list = d.utang.filter(u => tab === "lunas" ? sisaUtang(u) <= 0 : u.jenis === tab && sisaUtang(u) > 0)
    .sort((a, b) => (a.jatuhTempo || "9999").localeCompare(b.jatuhTempo || "9999"));
  const tb = (t, l) => '<button type="button" class="seg'+(tab === t ? " on" : "")+'" data-aksi="tab-utang" data-t="'+t+'" aria-pressed="'+(tab === t)+'">'+l+'</button>';
  const kartu = list.map(u => {
    const sisa = sisaUtang(u), dibayar = u.nominal - sisa, pct = dibayar / u.nominal * 100;

      const h = hariAntara(tglLokal(), u.jatuhTempo);

        : h === 0 ? '<span class="rchip" style="background:var(--kuning-bg);color:var(--kuning-teks)">Jatuh tempo hari ini</span>'
        : '<span class="rchip" style="background:var(--tint);color:var(--chip-teks)">'+h+' hari lagi</span>';
    }

        '<button type="button" class="btn-ikon" data-aksi="ubah-utang" data-id="'+u.id+'" aria-label="Ubah catatan '+esc(u.nama)+'">'+ikon("ubah")+'</button></div>'+

      (sisa > 0 ? '<div class="row-btn" style="justify-content:flex-start">'+tombolAksi("bayar-utang", u.jenis === "piutang" ? "Terima pembayaran" : "Bayar cicilan", "btn-primary", ' data-id="'+u.id+'"')+'</div>' : '')+
      '</article>';
  }).join("");

      tombolAksi("tambah-utang", ikon("plus") + "Catatan baru", "btn-primary")+'</header>'+

async function simpanUtang(){
  const d = S.sesi.data, f = S.formUtang, err = document.getElementById("err-utang");

/* ============ Tagihan rutin & pengingat (Pipo): jadwal fleksibel + tenor ============ */
const SATUAN_LABEL = {hari:"hari", minggu:"minggu", bulan:"bulan", tahun:"tahun"};
/* bentuk lama (bulanan per tanggal) → bentuk baru */
function migrasiRutin(r){
  if (r.mulaiTgl) { r.dicatatTgl = r.dicatatTgl || []; return r; }
  const tj = kb => kb + "-" + String(Math.min(r.tgl || 1, hariDalamBulan(kb))).padStart(2, "0");
  r.satuan = "bulan"; r.setiap = 1; r.tenor = 0;
  r.mulaiTgl = tj(r.mulai || kunciBulan(tglLokal()));
  r.dicatatTgl = (r.dicatat || []).map(tj);
  delete r.dicatat; delete r.mulai; delete r.tgl;
  return r;
}
function tambahBulanTgl(tgl, n, hariAsli){
  const p = tgl.split("-").map(Number), d = new Date(p[0], p[1] - 1 + n, 1);
  const kb = d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  return kb + "-" + pad2(Math.min(hariAsli, hariDalamBulan(kb)));
}
function jatuhKe(r, k){
  const n = r.setiap || 1, hariAsli = Number(r.mulaiTgl.slice(8));
  if (r.satuan === "hari") return tambahHari(r.mulaiTgl, k * n);

  if (r.satuan === "minggu" && n === 1) return "tiap minggu, hari " + namaHari(r.mulaiTgl);
  if (r.satuan === "minggu") return "tiap " + n + " minggu, hari " + namaHari(r.mulaiTgl);
