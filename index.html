      bar(pct, "#6F8F5E")+
      (sisa > 0 ? '<div class="row-btn" style="justify-content:flex-start">'+tombolAksi("bayar-utang", u.jenis === "piutang" ? "Terima pembayaran" : "Bayar cicilan", "btn-primary", ' data-id="'+u.id+'"')+'</div>' : '')+
      '</article>';
  }).join("");

      tombolAksi("tambah-utang", ikon("plus") + "Catatan baru", "btn-primary")+'</header>'+
    '<div class="stats">'+
      '<div class="card stat"><span class="lbl" style="color:var(--green)">Orang lain berutang padamu</span><span class="val">'+rupiah(totPiutang)+'</span></div>'+

/* ============ Tagihan rutin & pengingat (Pipo): jadwal fleksibel + tenor ============ */
const SATUAN_LABEL = {hari:"hari", minggu:"minggu", bulan:"bulan", tahun:"tahun"};
/* bentuk lama (bulanan per tanggal) → bentuk baru */
function migrasiRutin(r){
  if (r.mulaiTgl) { r.dicatatTgl = r.dicatatTgl || []; return r; }
  const tj = kb => kb + "-" + String(Math.min(r.tgl || 1, hariDalamBulan(kb))).padStart(2, "0");
  r.satuan = "bulan"; r.setiap = 1; r.tenor = 0;
  r.mulaiTgl = tj(r.mulai || kunciBulan(tglLokal()));
  r.dicatatTgl = (r.dicatat || []).map(tj);
  delete r.dicatat; delete r.mulai; delete r.tgl;
  return r;
}
function tambahBulanTgl(tgl, n, hariAsli){
  const p = tgl.split("-").map(Number), d = new Date(p[0], p[1] - 1 + n, 1);
  const kb = d.getFullYear() + "-" + pad2(d.getMonth() + 1);
  return kb + "-" + pad2(Math.min(hariAsli, hariDalamBulan(kb)));
}
function jatuhKe(r, k){
  const n = r.setiap || 1, hariAsli = Number(r.mulaiTgl.slice(8));
  if (r.satuan === "hari") return tambahHari(r.mulaiTgl, k * n);
  if (r.satuan === "minggu") return tambahHari(r.mulaiTgl, k * n * 7);
  if (r.satuan === "tahun") return tambahBulanTgl(r.mulaiTgl, k * n * 12, hariAsli);
  return tambahBulanTgl(r.mulaiTgl, k * n, hariAsli);
}
function jadwalRutin(r, sampai){
  const out = [];
  for (let k = 0; k < 600; k++){
    if (r.tenor && k >= r.tenor) break;
    const t = jatuhKe(r, k);

async function simpanRutin(){
  const d = S.sesi.data, f = S.formRutin, err = document.getElementById("err-rutin");
  const nama = document.getElementById("in-rnama").value.trim(), nominal = nilaiUang("in-rnom");
  const setiap = Math.round(Number(document.getElementById("in-rsetiap").value)), satuan = document.getElementById("in-rsatuan").value;
  const mulaiTgl = document.getElementById("in-rmulai").value, tenorV = document.getElementById("in-rtenor").value.trim();
  const tenor = tenorV ? Math.round(Number(tenorV)) : 0;
  const mode = document.querySelector('input[name="rmode"]:checked').value;
  if (!nama){ err.textContent = "Isi nama tagihannya."; return; }
  if (!nominal || isNaN(nominal) || nominal <= 0){ err.textContent = "Isi nominal yang benar."; return; }
  if (!(setiap >= 1 && setiap <= 365)){ err.textContent = "Ulangi setiap harus 1 sampai 365."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(mulaiTgl)){ err.textContent = "Isi tanggal jatuh tempo pertama."; return; }
  if (!(tenor >= 0 && tenor <= 600)){ err.textContent = "Tenor harus 0 sampai 600 kali."; return; }
  const data = {nama, jenis:f.jenis, nominal, kategoriId:document.getElementById("in-rkat").value, sub:document.getElementById("in-rsub").value.trim(),
    dompetId:document.getElementById("in-rdompet").value, setiap, satuan, mulaiTgl, tenor, mode, ingatkan:Number(document.getElementById("in-ringat").value)};
  const r = f.id ? d.rutin.find(x => x.id === f.id) : null;
  if (r){
    if (r.mulaiTgl !== mulaiTgl || r.satuan !== satuan || r.setiap !== setiap){
      const lama = r.dicatatTgl;
      Object.assign(r, data);
      r.dicatatTgl = jadwalRutin(r, tglLokal()).filter(t => lama.includes(t)).concat(lama.filter(t => t > tglLokal()));
      if (r.dicatatTgl.length < lama.length) r.dicatatTgl = jadwalRutin(r, tglLokal()).slice(0, lama.length);
    } else Object.assign(r, data);
    r.aktif = document.getElementById("in-raktif").checked;
  } else d.rutin.push(Object.assign({id:uid(), dicatatTgl:[], aktif:true}, data));
  const n = prosesRutin();
  await simpanPribadi(); tutupModal(); render();
  toast(n ? "Tersimpan. Pipo langsung mencatat " + n + " transaksi." : "Tagihan rutin tersimpan.");
}

function simpanJadwal(){
  if (!S.sesi) return;
  const d = S.sesi.data, hari = tglLokal(), batas = tambahHari(hari, 60), j = [];
  d.rutin.forEach(migrasiRutin);
  d.rutin.filter(r => r.aktif && r.mode === "ingatkan" && !rutinSelesai(r)).forEach(r => {
    jadwalRutin(r, batas).forEach(t => { if (t >= tambahHari(hari, -3) && !r.dicatatTgl.includes(t)) j.push({t, h:r.ingatkan}); });
  });
  d.utang.filter(u => u.jatuhTempo && sisaUtang(u) > 0).forEach(u => j.push({t:u.jatuhTempo, h:3}));
  jadwal8(j);
  tulisJson(kJadwal(S.sesi.user.id), j);

function cekPengingat(){
  if (!S.meta || !S.meta.pengguna) return;
  const hari = tglLokal(), log = bacaJson(K_NOTIF) || {};
  Object.keys(log).forEach(k => { if (log[k] !== hari) delete log[k]; });
  const sudah = k => log[k] === hari, tandai = k => { log[k] = hari; };
  if (S.sesi){
    daftarPengingat().forEach(p => {
      const k = S.sesi.user.id + ":" + p.kunci;
      if (sudah(k)) return;
      tandai(k);
      kirimNotif("Pipo: " + p.nama, teksNominal(p) + (p.jenis === "ultah" ? " Tinggal " + teksHari(p.h) + "." : ", jatuh tempo " + teksHari(p.h) + "."));
    });
  }
  S.meta.pengguna.forEach(u => {
    if (S.sesi && S.sesi.user.id === u.id) return;
    (bacaJson(kJadwal(u.id)) || []).forEach(x => {
      const h = hariAntara(hari, x.t);
      if (h > x.h || h < -3) return;
      const k = u.id + ":j:" + x.t;
      if (sudah(k)) return;
      tandai(k);
      kirimNotif("Pipo untuk " + u.nama, "Ada tagihan yang jatuh tempo " + teksHari(h) + ". Buka Dompet Kita untuk melihatnya.");
    });
  });
  tulisJson(K_NOTIF, log);
}

const pad2 = n => String(n).padStart(2, "0");
const awalPeriode = () => (S.sesi && S.sesi.data.pengaturan.awalPeriode) || 1;
function periode(tgl){
  const a = awalPeriode(), hari = Number(tgl.slice(8, 10));
  return hari >= a ? tgl.slice(0, 7) : geserBulan(tgl.slice(0, 7), -1);
}
function tambahHari(tgl, n){
  const p = tgl.split("-").map(Number), d = new Date(p[0], p[1] - 1, p[2] + n);
  return tglLokal(d);
}
function rentangPeriode(kb){
  const a = awalPeriode(), kb2 = geserBulan(kb, 1);
  const mulai = kb + "-" + pad2(Math.min(a, hariDalamBulan(kb)));
  const akhir = tambahHari(kb2 + "-" + pad2(Math.min(a, hariDalamBulan(kb2))), -1);
  return {mulai, akhir};
}
function labelPeriode(kb){
  if (awalPeriode() === 1) return labelBulan(kb);
  const r = rentangPeriode(kb), f = t => new Date(t + "T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"short"});
  return f(r.mulai) + " – " + f(r.akhir) + " " + r.akhir.slice(0, 4);
}

const totalTabPribadi = () => S.sesi.data.tabungan.reduce((a, t) => a + totalSetoran(t), 0) + totalSetoran(S.sesi.data.danaDarurat);
const totalTabBerdua = () => S.sesi.bersama.tabungan.reduce((a, t) => a + totalSetoran(t), 0);
function setoranPeriode(kb){
  let s = 0;
  const hit = list => (list || []).forEach(e => { if (periode(e.tanggal) === kb) s += e.nominal; });
  S.sesi.data.tabungan.forEach(t => hit(t.setoran));
  hit(S.sesi.data.danaDarurat.setoran);
  return s;
}
function harianKeluar(kb){
  const m = {};
  S.sesi.data.transaksi.forEach(t => { if (t.jenis === "keluar" && periode(t.tanggal) === kb) m[t.tanggal] = (m[t.tanggal] || 0) + t.nominal; });
  return m;
}
function wawasan(kb){
  const r = ringkasBulan(kb), lalu = geserBulan(kb, -1), p = ringkasBulan(lalu), out = [];
  if (!r.n) return ["Belum ada catatan di periode ini."];
  if (p.keluar){
    const ch = (r.keluar - p.keluar) / p.keluar * 100;
    out.push("Pengeluaran " + (ch >= 0 ? "naik " : "turun ") + Math.abs(ch).toFixed(0) + "% dibanding " + labelPeriode(lalu) + (ch < 0 ? ". Mantap!" : "."));
  }
  const kats = perKategori(kb, "keluar");
  if (kats[0] && r.keluar) out.push("Paling banyak untuk " + kats[0].nama + ": " + rupiah(kats[0].nominal) + " (" + Math.round(kats[0].nominal / r.keluar * 100) + "% dari pengeluaran).");
  const lama = {}; perKategori(lalu, "keluar").forEach(k => { lama[k.nama] = k.nominal; });
  let naik = null;
  kats.forEach(k => { if (lama[k.nama] && k.nominal > lama[k.nama]){ const d = k.nominal - lama[k.nama]; if (!naik || d > naik.d) naik = {k, d, p:d / lama[k.nama] * 100}; } });
  if (naik && naik.p >= 10) out.push(naik.k.nama + " naik " + Math.round(naik.p) + "% (" + rupiah(lama[naik.k.nama]) + " → " + rupiah(naik.k.nominal) + ").");
  const h = harianKeluar(kb), hariMax = Object.keys(h).sort((a, b) => h[b] - h[a])[0];
  if (hariMax) out.push("Hari paling boros: " + new Date(hariMax + "T00:00:00").toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long"}) + " (" + rupiah(h[hariMax]) + ").");
  const rg = rentangPeriode(kb), hari = tglLokal();
  const jml = hari < rg.mulai ? 1 : Math.max(1, hariAntara(rg.mulai, hari < rg.akhir ? hari : rg.akhir) + 1);
  if (r.keluar) out.push("Rata-rata pengeluaran " + rupiah(Math.round(r.keluar / jml)) + " per hari.");
  if (r.masuk){
    const rasio = (r.masuk - r.keluar) / r.masuk * 100;
    out.push(rasio >= 20 ? "Kamu menyisakan " + rasio.toFixed(0) + "% dari pemasukan. Hebat!"
      : rasio >= 0 ? "Sisa " + rasio.toFixed(0) + "% dari pemasukan. Coba targetkan minimal 20%."
      : "Besar pasak daripada tiang: pengeluaran melebihi pemasukan sebesar " + rupiah(r.keluar - r.masuk) + ".");
  }
  const ang = dataAnggaran(kb);
  if (ang.length){
    const lewat = ang.filter(x => x.st.kode === "lewat").length, awas = ang.filter(x => x.st.kode === "awas").length;
    out.push(lewat ? lewat + " anggaran lewat batas" + (awas ? " dan " + awas + " hampir habis." : ".") : awas ? awas + " anggaran sudah di atas 80%." : "Semua anggaran aman. Kenzo bangga!");
  }
  const sp = setoranPeriode(kb);
  if (sp > 0) out.push("Kamu menabung " + rupiah(sp) + " di periode ini.");
  return out;
}
function grafik6(kb){

  const max = Math.max(1, ...data.map(x => Math.max(x.masuk, x.keluar)));
  const W = 640, H = 250, pl = 64, pb = 34, pt = 14, cw = (W - pl - 10) / 6, tinggi = H - pb - pt;
  let s = '<svg viewBox="0 0 '+W+' '+H+'" class="grafik" role="img" aria-label="Grafik pemasukan dan pengeluaran 6 periode terakhir">';

      '<text x="'+cx+'" y="'+(H - 10)+'" text-anchor="middle" font-size="13" font-weight="'+(x.k === kb ? 800 : 600)+'" style="fill:'+(x.k === kb ? "var(--text)" : "var(--muted)")+'">'+namaBulanPendek(x.k)+'</text>';

}
function kalenderHTML(kb){
  const rg = rentangPeriode(kb), h = harianKeluar(kb), hari = tglLokal();
  const max = Math.max(0, ...Object.values(h));
  const offset = (new Date(rg.mulai + "T00:00:00").getDay() + 6) % 7;
  let sel = ["Sen", "Sel", "Rab", "Kam", "Jum", "Sab", "Min"].map(x => '<span class="kal-hd">'+x+'</span>').join("");
  for (let i = 0; i < offset; i++) sel += '<span></span>';
  let kosong = 0;
  for (let t = rg.mulai; t <= rg.akhir; t = tambahHari(t, 1)){
    const v = h[t] || 0, lv = v ? Math.max(1, Math.ceil(v / max * 4)) : 0, lewat = t <= hari;

    sel += '<button type="button" class="kal-sel lv'+lv+(t === hari ? " kini" : "")+(lewat ? "" : " nanti")+'" data-aksi="kal-hari" data-t="'+t+'"'+(lewat ? "" : " disabled")+

      '<strong>'+Number(t.slice(8))+'</strong>'+(v ? '<span>'+ringkas(v).replace("Rp ", "")+'</span>' : '')+'</button>';

/* dipanggil setiap kali data disimpan */
async function pascaSimpan(){
  if (!S.sesi || S.sedangPasca) return;
  S.sedangPasca = true;
  try {
    const d = S.sesi.data, lvSebelum = d.levelTertinggi || 1;
    const h = evaluasiLencana();
    const info = infoLevel();
    let naik = null;
    if (info.lv > lvSebelum){ naik = {lv:info.lv, gelar:info.gelar, gelarBaru:gelarDari(info.lv) !== gelarDari(lvSebelum)}; d.levelTertinggi = info.lv; }
    if (h.baru.length || naik || d.levelTertinggi == null){ d.levelTertinggi = Math.max(d.levelTertinggi || 1, info.lv); await tulisPribadi(); if (h.ubahB) await tulisBersama(); }
    if (h.baru.length || naik) antrekanPerayaan(h.baru, naik);
    await perbaruiRingkasanBersama();
  } finally { S.sedangPasca = false; }
}
function catatHalaman(h){
  if (!S.sesi) return;
  const st = statistik();
  if (!st.halaman.includes(h)){ st.halaman.push(h); simpanPribadi(); }
}
async function catatAktifBersama(){
  const b = S.sesi.bersama, me = S.sesi.user.id, hari = tglLokal();
  b.aktif = b.aktif || {};
  const l = b.aktif[me] = b.aktif[me] || [];

  l.push(hari); if (l.length > 120) l.splice(0, l.length - 120);

}

async function idbSemua(){
  const db = await bukaDB();
  return new Promise((res, rej) => {
    const tx = db.transaction("foto", "readonly"), st = tx.objectStore("foto");
    const rk = st.getAllKeys(), rv = st.getAll();
    tx.oncomplete = () => res(rk.result.map((k, i) => [k, rv.result[i]]));
    tx.onerror = () => rej(tx.error);
  });
}
async function buatBackup(denganFoto){
  const meta = bacaJson(K_META);
  const data = {aplikasi:"Dompet Kita", format:1, dibuat:new Date().toISOString(), meta, bersama:bacaJson(K_BERSAMA), brankas:{}, foto:{}};
  meta.pengguna.forEach(u => { data.brankas[u.id] = bacaJson(kBrankas(u.id)); });
  if (denganFoto){
    try { (await idbSemua()).forEach(e => { data.foto[e[0]] = {iv:keB64(e[1].iv), ct:keB64(e[1].ct)}; }); } catch(e){}
  }
  return new File([JSON.stringify(data)], "DompetKita-backup-" + tglLokal() + ".json", {type:"application/json"});
}

async function pulihkanYa(){
  const err = document.getElementById("err-pulih"), f = document.getElementById("in-pulih").files[0];
  if (!f){ err.textContent = "Pilih file backup dulu."; return; }
  if (!document.getElementById("in-pulih-ok").checked){ err.textContent = "Centang dulu tanda paham."; return; }
  let data;
  try { data = JSON.parse(await f.text()); } catch(e){ err.textContent = "File ini bukan backup Dompet Kita."; return; }
  if (!data || data.aplikasi !== "Dompet Kita" || !data.meta || !Array.isArray(data.meta.pengguna) || !data.brankas){ err.textContent = "File ini bukan backup Dompet Kita."; return; }
  try {
    Object.keys(localStorage).filter(k => k.startsWith(PFX) && k !== K_TEMA).forEach(k => localStorage.removeItem(k));
    tulisJson(K_META, data.meta);
    if (data.bersama) tulisJson(K_BERSAMA, data.bersama);
    Object.keys(data.brankas).forEach(id => { if (data.brankas[id]) tulisJson(kBrankas(id), data.brankas[id]); });
    await hapusSemuaFoto();
    const db = await bukaDB();
    await new Promise((res, rej) => {
      const tx = db.transaction("foto", "readwrite"), st = tx.objectStore("foto");
      Object.keys(data.foto || {}).forEach(k => st.put({iv:dariB64(data.foto[k].iv), ct:dariB64(data.foto[k].ct).buffer}, k));
      tx.oncomplete = res; tx.onerror = () => rej(tx.error);
    });
  } catch(e){ console.error(e); err.textContent = "Gagal memulihkan: penyimpanan browser penuh atau diblokir."; return; }
  tutupModal();
  S.sesi = null; S.meta = data.meta; S.loginId = data.meta.pengguna[0].id;
  S.pesanLogin = "Data berhasil dipulihkan. Masuk dengan PIN dari backup.";
  S.layar = "login"; render();
}

function usiaDari(lahir, pada){
  if (!lahir) return null;
  const a = lahir.split("-").map(Number), b = (pada || tglLokal()).split("-").map(Number);
  let u = b[0] - a[0];

const kabisat = y => (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0;

const ultahHariIni = lahir => !!lahir && ultahTahun(lahir.slice(5), Number(tglLokal().slice(0, 4))) === tglLokal();

  const b = S.sesi.bersama, me = S.sesi.user.id, hari = tglLokal(), th = Number(hari.slice(0, 4)), out = [];
  Object.keys(b.ultah || {}).forEach(id => {
    if (id === me || !S.meta.pengguna.some(p => p.id === id)) return;
    const x = b.ultah[id];
    let t = ultahTahun(x.tgl, th);
    if (t < hari) t = ultahTahun(x.tgl, th + 1);
    const h = hariAntara(hari, t);
    if (h <= 7) out.push({kunci:"ultah:" + id + ":" + t, jenis:"ultah", nama:"Ulang tahun " + namaPengguna(id), nominal:null, due:t, h});
  });

function hitungAlokasi(kb){
  const a = S.sesi.data.alokasi, r = ringkasBulan(kb), dasar = r.masuk;

/* ============ 3. Tantangan menabung (Roo) ============ */
const JENIS_TANTANGAN = {
  "52minggu":{nama:"Tantangan 52 minggu", ikon:"52", desk:"Minggu ke-1 setor 1× nominal dasar, minggu ke-2 2×, terus sampai minggu ke-52. Boleh diisi acak, misalnya minggu yang besar saat baru gajian.", dasar:10000},
  "receh":{nama:"Receh harian", ikon:"Rp", desk:"Setiap hari sisihkan uang receh dengan nominal yang sama. Kecil tapi rutin, lama-lama jadi bukit.", dasar:5000, durasi:30},
  "tanpajajan":{nama:"Hari tanpa jajan", ikon:"0", desk:"Tahan diri tidak jajan di kategori pilihanmu. Roo menghitung otomatis dari catatan transaksi.", durasi:30, target:15}
};
const isiTantangan = x => Object.keys(x.isi || {}).length;
function slotTantangan(x){ return x.jenis === "52minggu" ? 52 : x.durasi; }
const nominalSlot = (x, n) => x.jenis === "52minggu" ? x.dasar * n : x.dasar;
function totalTargetTantangan(x){ return x.jenis === "52minggu" ? x.dasar * 1378 : x.jenis === "receh" ? x.dasar * x.durasi : 0; }
function terkumpulTantangan(x){ return Object.keys(x.isi || {}).reduce((a, n) => a + nominalSlot(x, Number(n)), 0); }
function hariJajan(x){
  const set = new Set(), kats = new Set(x.kategori || []), akhir = tambahHari(x.mulai, x.durasi - 1);
  S.sesi.data.transaksi.forEach(t => { if (t.jenis === "keluar" && kats.has(t.kategoriId) && t.tanggal >= x.mulai && t.tanggal <= akhir) set.add(t.tanggal); });
  return set;
}
function statusTanpaJajan(x){
  const jajan = hariJajan(x), hari = hariIni(), akhir = tambahHari(x.mulai, x.durasi - 1);
  let berhasil = 0, lewat = 0;
  for (let i = 0; i < x.durasi; i++){
    const t = tambahHari(x.mulai, i);
    if (t >= hari) break;
    lewat++; if (!jajan.has(t)) berhasil++;
  }
  const sisaHari = Math.max(0, hariAntara(hari, akhir) + 1);
  return {berhasil, lewat, sisaHari, tercapai:berhasil >= x.target, gagal:berhasil + sisaHari < x.target, selesai:hari > akhir, jajan};
}
function tantanganSelesai(x){
  if (x.jenis === "tanpajajan") return statusTanpaJajan(x).tercapai;
  return isiTantangan(x) >= slotTantangan(x);
}
function tantanganAktif(x){
  if (x.dihentikan) return false;
  if (x.jenis === "tanpajajan"){ const s = statusTanpaJajan(x); return !s.tercapai && !s.gagal; }
  return !tantanganSelesai(x);
}
function tujuanTantangan(x){
  try { return x.tujuan ? objekMutasi(x.tujuan.t, x.tujuan.id) : null; } catch(e){ return null; }
}
function kartuTantangan(x){
  const J = JENIS_TANTANGAN[x.jenis], aktif = tantanganAktif(x), tuj = tujuanTantangan(x);
  let isi = "", prog = 0, info = "";
  if (x.jenis === "tanpajajan"){
    const s = statusTanpaJajan(x);
    prog = s.berhasil / x.target * 100;
    info = '<strong>'+s.berhasil+'</strong> dari target '+x.target+' hari tanpa jajan · '+(s.tercapai ? "Berhasil!" : s.gagal ? "Belum berhasil kali ini" : "sisa "+s.sisaHari+" hari");
    const hari = hariIni();
    isi = '<div class="roo-grid">'+Array.from({length:x.durasi}, (_, i) => {
      const t = tambahHari(x.mulai, i), kls = t > hari ? "nanti" : s.jajan.has(t) ? "jajan" : t === hari ? "kini" : "isi";
      return '<button type="button" class="roo-sel '+kls+'" data-aksi="kal-hari" data-t="'+t+'" title="'+tglPendek(t)+(kls === "jajan" ? " · ada jajan" : kls === "isi" ? " · tanpa jajan" : "")+'">'+Number(t.slice(8))+'</button>';
    }).join("")+'</div>'+
    '<p class="muted" style="font-size:13px">Kategori jajan: '+(x.kategori || []).map(id => esc((kat(id) || {nama:"?"}).nama)).join(", ")+'. Hijau = tanpa jajan, merah = ada jajan.</p>';
  } else {
    const n = slotTantangan(x), hari = hariIni();
    prog = isiTantangan(x) / n * 100;
    info = '<strong>'+rupiah(terkumpulTantangan(x))+'</strong> dari '+rupiah(totalTargetTantangan(x))+' · '+isiTantangan(x)+'/'+n+(x.jenis === "52minggu" ? " minggu" : " hari");
    isi = '<div class="roo-grid'+(x.jenis === "52minggu" ? " roo-52" : "")+'">'+Array.from({length:n}, (_, i) => {
      const k = i + 1, sudah = x.isi && x.isi[k];
      if (x.jenis === "receh"){
        const t = tambahHari(x.mulai, i), nanti = t > hari;
        return '<button type="button" class="roo-sel '+(sudah ? "isi" : nanti ? "nanti" : t === hari ? "kini" : "")+'" data-aksi="roo-slot" data-id="'+x.id+'" data-n="'+k+'"'+(nanti && !sudah ? " disabled" : "")+' title="Hari ke-'+k+' · '+tglPendek(t)+'">'+Number(t.slice(8))+'</button>';
      }
      return '<button type="button" class="roo-sel '+(sudah ? "isi" : "")+'" data-aksi="roo-slot" data-id="'+x.id+'" data-n="'+k+'" title="Minggu ke-'+k+': '+rupiah(nominalSlot(x, k))+'">'+k+'</button>';
    }).join("")+'</div>'+
    '<p class="muted" style="font-size:13px">Ketuk kotak untuk setor'+(x.jenis === "52minggu" ? " sesuai nominal minggunya" : " "+rupiah(x.dasar))+'. Ketuk kotak yang sudah terisi untuk membatalkan. Tujuan: <strong>'+(tuj ? esc(tuj.nama) : "sudah dihapus, ubah tujuan dulu")+'</strong>.</p>';
  }
  const selesai = tantanganSelesai(x);
  return '<article class="card roo-kartu'+(aktif ? "" : " roo-selesai")+'"><div class="ang-head"><span class="roo-ikon">'+J.ikon+'</span><div style="flex:1 1 auto"><h3>'+esc(x.nama || J.nama)+'</h3>'+
      '<p class="muted" style="font-size:13px">Mulai '+tglPendek(x.mulai)+(x.jenis !== "52minggu" ? " · " + x.durasi + " hari" : "")+'</p></div>'+
      (selesai ? '<span class="rchip" style="background:var(--green-bg);color:var(--hijau-teks)">Selesai!</span>' : x.dihentikan ? '<span class="rchip" style="background:var(--tint);color:var(--chip-teks)">Dihentikan</span>' : '')+
      '<button type="button" class="btn-ikon" data-aksi="ubah-tantangan" data-id="'+x.id+'" aria-label="Ubah tantangan">'+ikon("ubah")+'</button></div>'+
    '<p style="font-size:14px">'+info+'</p>'+bar(prog, selesai ? "#6F8F5E" : "#E3A857")+isi+
    (x.jenis === "receh" && aktif && !(x.isi || {})[hariAntara(x.mulai, hariIni()) + 1] && hariAntara(x.mulai, hariIni()) < x.durasi && hariAntara(x.mulai, hariIni()) >= 0
      ? '<div class="row-btn" style="justify-content:flex-start">'+tombolAksi("roo-slot", "Setor hari ini " + rupiah(x.dasar), "btn-primary", ' data-id="'+x.id+'" data-n="'+(hariAntara(x.mulai, hariIni()) + 1)+'"')+'</div>' : '')+
  '</article>';
}

async function simpanTantangan(){
  const f = S.formTantangan, d = S.sesi.data, err = document.getElementById("err-tg");
  const x = f.id ? d.tantangan.find(y => y.id === f.id) : null;
  const nama = document.getElementById("in-tg-nama").value.trim() || JENIS_TANTANGAN[f.jenis].nama;
  const mulai = document.getElementById("in-tg-mulai").value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(mulai)){ err.textContent = "Isi tanggal mulai."; return; }
  const rec = {nama, mulai};
  const dsel = document.getElementById("in-tg-durasi");
  if (dsel) rec.durasi = Number(dsel.value);
  if (f.jenis === "tanpajajan"){
    const target = Number(document.getElementById("in-tg-target").value);
    const kats = [...document.querySelectorAll(".tg-kat:checked")].map(c => c.value);
    if (!Number.isInteger(target) || target < 1 || target > rec.durasi){ err.textContent = "Target harus 1 sampai " + rec.durasi + " hari."; return; }
    if (!kats.length){ err.textContent = "Pilih minimal satu kategori jajan."; return; }
    Object.assign(rec, {target, kategori:kats});
  } else {
    const dasar = nilaiUang("in-tg-dasar");
    if (!dasar || isNaN(dasar) || dasar <= 0){ err.textContent = "Isi nominal dasar yang benar."; return; }
    const [t, id] = document.getElementById("in-tg-tujuan").value.split(":");
    Object.assign(rec, {dasar, tujuan:{t, id}, dompetId:document.getElementById("in-tg-dompet").value || null});
    if (x && isiTantangan(x)){ delete rec.dasar; delete rec.durasi; if (f.jenis === "receh") delete rec.mulai; }
  }
  if (x) Object.assign(x, rec);
  else d.tantangan.push(Object.assign({id:uid(), jenis:f.jenis, isi:{}, dibuat:hariIni()}, rec));
  await simpanPribadi(); tutupModal(); render();
  toast(x ? "Tantangan diperbarui." : "Roo: tantangan dimulai! Hop hop!");
}
async function hapusTantangan(){
  const f = S.formTantangan, d = S.sesi.data, x = d.tantangan.find(y => y.id === f.id);
  if (!x) return;
  if (tantanganAktif(x)){
    if (!f.yakin){ f.yakin = true; document.querySelector('[data-aksi="hapus-tantangan"]').textContent = "Yakin? Klik lagi"; return; }
    x.dihentikan = hariIni();

  d.tantangan = d.tantangan.filter(y => y.id !== x.id);
  await simpanPribadi(); tutupModal(); render(); toast("Riwayat tantangan dihapus.");
}

async function setorSlotRoo(){
  const f = S.formSlot, d = S.sesi.data, x = d.tantangan.find(y => y.id === f.id), err = document.getElementById("err-slot");
  const tuj = tujuanTantangan(x), nominal = nominalSlot(x, f.n), dompetId = document.getElementById("in-slot-dompet").value || null;

/* ============ 5. Pengingat mencatat harian (Owi) ============ */
/* disimpan tanpa enkripsi (hanya jam & tanggal terakhir mencatat) supaya tetap jalan saat terkunci */
const kIngat = id => PFX + "ingat." + id;
function sudahCatatHariIni(){
  const d = S.sesi.data, h = hariIni();
  return d.pengaturan.tanpaCatat === h || d.transaksi.some(t => !t.otomatis && !t.terkait && tglLokal(new Date(t.dibuat)) === h);
}
function tulisIngat(){
  if (!S.sesi) return;
  const ic = S.sesi.data.pengaturan.ingatCatat;
  tulisJson(kIngat(S.sesi.user.id), {aktif:!!ic.aktif, jam:ic.jam, sudah:sudahCatatHariIni() ? hariIni() : ""});
}
const jamSekarang = () => { const d = new Date(); return pad2(d.getHours()) + ":" + pad2(d.getMinutes()); };
function waktunyaIngat(){
  if (!S.sesi) return false;
  const ic = S.sesi.data.pengaturan.ingatCatat;
  return ic.aktif && jamSekarang() >= ic.jam && !sudahCatatHariIni();
}
function cekIngatCatat(){
  if (!S.meta || !S.meta.pengguna) return;
  const h = hariIni(), log = bacaJson(K_NOTIF) || {};
  let ubah = false;
  S.meta.pengguna.forEach(u => {
    const x = bacaJson(kIngat(u.id));
    if (!x || !x.aktif || jamSekarang() < x.jam) return;
    if (S.sesi && S.sesi.user.id === u.id){ if (sudahCatatHariIni()) return; }
    else if (x.sudah === h) return;
    const k = u.id + ":catat";
    if (log[k] === h) return;
    log[k] = h; ubah = true;
    kirimNotif("Owi untuk " + u.nama, "Sudah catat pengeluaran hari ini? Satu menit saja, biar besok tidak lupa.");
    if (S.sesi && S.sesi.user.id === u.id){ toast("Owi: sudah catat pengeluaran hari ini? Hu-huu!"); if (S.halaman === "beranda" && !document.querySelector(".backdrop")) render(); }
  });
  if (ubah) tulisJson(K_NOTIF, log);
}

/* ============ 7. Ringkasan mingguan (Rubi) ============ */
function seninDari(tgl){ const dow = new Date(tgl + "T00:00:00").getDay(); return tambahHari(tgl, -((dow + 6) % 7)); }
function ringkasRentang(a, b){
  let masuk = 0, keluar = 0, n = 0; const perKat = {}, hariKeluar = new Set();
  S.sesi.data.transaksi.forEach(t => {
    if (t.tanggal < a || t.tanggal > b || t.jenis === "pindah") return;
    n++;
    if (t.jenis === "masuk") masuk += t.nominal;
    else { keluar += t.nominal; hariKeluar.add(t.tanggal); perKat[t.kategoriId] = (perKat[t.kategoriId] || 0) + t.nominal; }
  });
  const top = Object.keys(perKat).map(id => ({k:kat(id) || {nama:"Tanpa kategori", warna:"#BFA58E"}, nominal:perKat[id]})).sort((x, y) => y.nominal - x.nominal);
  const sampai = b < hariIni() ? b : hariIni();
  const hariTotal = Math.max(0, hariAntara(a, sampai) + 1);
  return {masuk, keluar, n, top, tanpaBelanja:Math.max(0, hariTotal - [...hariKeluar].filter(t => t <= sampai).length), hariTotal};
}
function mingguTarget(){
  const h = hariIni(), kini = seninDari(h), d = new Date();
  return d.getDay() === 0 && d.getHours() >= 18 ? kini : tambahHari(kini, -7);
}
function cekMingguan(){
  const d = S.sesi.data;
  if (!d.pengaturan.ringkasMinggu) return false;
  const key = mingguTarget();
  if (d.pengaturan.mingguTerakhir === key) return false;
  d.pengaturan.mingguTerakhir = key;
  if (hariAntara(tambahHari(key, 6), hariIni()) > 3) return false;
  const r = ringkasRentang(key, tambahHari(key, 6)), p = ringkasRentang(tambahHari(key, -7), tambahHari(key, -1));
  if (!r.n && !p.n) return false;
  tampilMingguan(key);
  return true;
}
function tampilMingguan(key){
  if (!key){
    key = mingguTarget();
    const kini = seninDari(hariIni());
    if (key !== kini && !ringkasRentang(key, tambahHari(key, 6)).n && ringkasRentang(kini, tambahHari(kini, 6)).n) key = kini;
  }
  const akhir = tambahHari(key, 6), r = ringkasRentang(key, akhir), p = ringkasRentang(tambahHari(key, -7), tambahHari(key, -1));
  const ch = p.keluar ? (r.keluar - p.keluar) / p.keluar * 100 : null;
  const tips = [];
  if (ch != null) tips.push(ch > 5 ? "Pengeluaran naik " + Math.round(ch) + "% dari minggu sebelumnya" + (r.top[0] ? ". Paling banyak di " + r.top[0].k.nama + "." : ".")
    : ch < -5 ? "Pengeluaran turun " + Math.round(-ch) + "% dari minggu sebelumnya. Mantap!" : "Pengeluaran hampir sama dengan minggu sebelumnya. Stabil!");
  if (!r.n) tips.push("Belum ada catatan di minggu ini.");
  else if (r.tanpaBelanja) tips.push(r.tanpaBelanja + " hari tanpa pengeluaran sama sekali" + (r.tanpaBelanja >= 2 ? ". Hebat!" : "."));
  const aktifRoo = S.sesi.data.tantangan.filter(tantanganAktif);
  if (aktifRoo.length) tips.push("Roo: " + aktifRoo.map(x => (x.nama || JENIS_TANTANGAN[x.jenis].nama) + " " + (x.jenis === "tanpajajan" ? statusTanpaJajan(x).berhasil + "/" + x.target : isiTantangan(x) + "/" + slotTantangan(x))).join(", ") + ".");
  const kein = S.sesi.data.keinginan.filter(w => statusKeinginan(w) === "siap").length;
  if (kein) tips.push("Snaily: " + kein + " keinginan siap diputuskan.");
  const baris = (l, a, b, kelas) => '<div class="mini-baris"><span>'+l+'</span><span><strong class="'+(kelas || "")+'">'+rupiah(a)+'</strong> <span class="muted" style="font-size:13px">vs '+rupiah(b)+'</span></span></div>';
  bukaModal('<div class="card-head" style="margin:0">'+maskot("rubi", 72)+'<div><span class="eyebrow">Ringkasan mingguan</span><h2 id="judul-modal">'+tglPendek(key)+' – '+tglPendek(akhir)+'</h2></div></div>'+
    '<p class="muted" style="font-size:13px">Dibandingkan dengan minggu sebelumnya ('+tglPendek(tambahHari(key, -7))+' – '+tglPendek(tambahHari(key, -1))+')</p>'+
    '<div class="mini-list">'+baris("Pemasukan", r.masuk, p.masuk, "naik")+baris("Pengeluaran", r.keluar, p.keluar, "turun")+
      '<div class="mini-baris"><span>Jumlah catatan</span><strong>'+r.n+'</strong></div></div>'+
    (r.top.length ? '<h3 style="margin-top:6px">Pengeluaran terbesar</h3><div class="mini-list">'+r.top.slice(0, 3).map(x => '<div class="mini-baris"><span><span class="sw" style="background:'+x.k.warna+'"></span> '+esc(x.k.nama)+'</span><strong>'+rupiah(x.nominal)+'</strong></div>').join("")+'</div>' : '')+
    (tips.length ? '<ul class="wawasan">'+tips.map(x => '<li>'+esc(x)+'</li>').join("")+'</ul>' : '')+
    '<div class="row-btn">'+tombolAksi("tutup-modal", "Tutup")+tombolAksi("minggu-siap", "Siap, minggu depan lebih baik!", "btn-primary")+'</div>');
}

function spark(vals, w, h){
  if (vals.length < 2) return "";
  w = w || 140; h = h || 34;
  const mn = Math.min(...vals), mx = Math.max(...vals), r = mx - mn || 1;
  const pts = vals.map((v, i) => (i / (vals.length - 1) * (w - 4) + 2).toFixed(1) + "," + (h - 3 - (v - mn) / r * (h - 6)).toFixed(1)).join(" ");
  const warna = vals[vals.length - 1] >= vals[0] ? "#6F8F5E" : "#C8614A";
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" width="'+w+'" height="'+h+'" aria-hidden="true"><polyline points="'+pts+'" fill="none" stroke="'+warna+'" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/></svg>';
}

function riwayatNilai(a){ return (a.riwayat || []).filter(r => r.tipe === "nilai"); }

function perubahanSejak(tglMulai){
  let s = 0;
  S.sesi.data.investasi.forEach(a => riwayatNilai(a).forEach(r => { if (r.tgl > tglMulai) s += r.sesudah - r.sebelum; }));

}
function catatRiwayat(a, e){ a.riwayat = a.riwayat || []; a.riwayat.push(Object.assign({id:uid()}, e)); }
function pastikanJht(saldo){

  if (!a){
    a = {id:uid(), nama:"JHT BPJS Ketenagakerjaan", jenis:"jht", platform:"BPJS Ketenagakerjaan (JMO)", satuan:"", unit:0, modal:saldo || 0, nilai:saldo || 0, nilaiTgl:hariIni(), riwayat:[], dibuat:hariIni()};

  const set = new Set(S.sesi.data.investasi.map(a => a.tujuan).filter(Boolean).concat(S.sesi.data.tabungan.map(t => t.nama), ["Dana darurat", "Dana pendidikan", "DP rumah", "Pensiun", "Ibadah haji/umrah", "Menikah"]));
  return [...set].map(t => '<option value="'+esc(t)+'"></option>').join("");
}
function perTujuanInv(){
  const m = {}; invAktif().forEach(a => { const t = a.tujuan || "Tanpa tujuan khusus"; m[t] = m[t] || {nilai:0, modal:0, n:0}; m[t].nilai += a.nilai; m[t].modal += a.modal; m[t].n++; });
  const k = Object.keys(m);
  if (k.length < 2 && k[0] === "Tanpa tujuan khusus") return "";
  return '<h3 style="margin:16px 0 8px">Per tujuan</h3><div class="mini-list">'+k.sort((x, y) => m[y].nilai - m[x].nilai).map(t => { const un = m[t].nilai - m[t].modal;
    return '<div class="mini-baris"><span>'+esc(t)+' <span class="muted" style="font-size:13px">('+m[t].n+' investasi)</span></span><span><strong>'+rupiah(m[t].nilai)+'</strong> <span class="'+kelasNaik(un)+'" style="font-size:13px">'+(m[t].modal ? fmtPct(un / m[t].modal * 100) : '')+'</span></span></div>'; }).join("")+'</div>';
}

async function simpanInv(){
  const f = S.formInv, d = S.sesi.data, err = document.getElementById("err-iv"), g = id => document.getElementById(id);
  const nama = g("in-iv-nama").value.trim(), jenis = g("in-iv-jenis").value;
  if (!nama){ err.textContent = "Isi nama investasinya."; return; }
  const dasar = {nama, jenis, platform:g("in-iv-plat").value.trim(), tujuan:g("in-iv-tujuan").value.trim(), satuan:PAKAI_SATUAN.includes(jenis) ? g("in-iv-satuan").value.trim() : "", syariah:g("in-iv-syariah").checked, jatuhTempo:g("in-iv-jt").value || ""};
  if (f.id){ Object.assign(invById(f.id), dasar); await simpanPribadi(); tutupModal(); render(); toast("Investasi diperbarui."); return; }
  const modal = nilaiUang("in-iv-modal"), nv = g("in-iv-nilai").value.trim(), nilai = nv ? hitung(nv) : modal, unit = dasar.satuan ? bacaAngka(g("in-iv-unit").value) : null;
  if (modal == null || isNaN(modal) || modal < 0){ err.textContent = "Isi modal yang benar (boleh 0)."; return; }
  if (nilai == null || isNaN(nilai) || nilai < 0){ err.textContent = "Nilai sekarang belum benar."; return; }
  if (unit != null && (isNaN(unit) || unit < 0)){ err.textContent = "Jumlah satuan belum benar. Pakai koma untuk desimal, misalnya 10,5."; return; }
  const dompetId = g("in-iv-dompet").value;
  if (dompetId && modal > saldoDompet(dompetId)){ err.textContent = "Saldo dompet tidak cukup (" + rupiah(saldoDompet(dompetId)) + ")."; return; }
  const a = Object.assign({id:uid(), unit:unit || 0, modal, nilai, nilaiTgl:hariIni(), riwayat:[], dibuat:hariIni()}, dasar);
  if (unit && nilai) a.hargaUnit = Math.round(nilai / unit);
  const txId = dompetId && modal ? buatTxTerkait(dompetId, null, modal, hariIni(), "Beli " + nama, {jenis:"inv", id:a.id, label:"Investasi " + nama}) : null;
  catatRiwayat(a, {tgl:hariIni(), tipe:dompetId ? "beli" : "awal", nominal:modal, unit:unit || 0, sebelum:0, sesudah:nilai, txId});
  d.investasi.push(a);
  await simpanPribadi(); tutupModal(); render(); toast("Garu mencatat investasi baru: " + nama + ".");
}
async function hapusInv(){
  const f = S.formInv, d = S.sesi.data, a = invById(f.id);
  if (!f.yakin){ f.yakin = true; document.getElementById("err-iv").textContent = "Hapus " + a.nama + " beserta riwayatnya? Transaksi beli/jual yang terkait juga dihapus, jadi saldo dompet ikut kembali. Klik Hapus sekali lagi."; return; }
  (a.riwayat || []).forEach(r => hapusTxId(r.txId));
  d.bpjs.forEach(b => { if (b.jhtId === a.id) b.jhtId = null; });
  d.investasi = d.investasi.filter(x => x.id !== a.id);
  await simpanPribadi(); tutupModal(); render(); toast("Investasi dihapus.");
}

async function simpanTxInv(){
  const f = S.formTxInv, a = invById(f.id), d = S.sesi.data, err = document.getElementById("err-ti"), g = id => document.getElementById(id);
  const n = nilaiUang("in-ti-nom"), tgl = g("in-ti-tgl").value, dompetId = g("in-ti-dompet").value, unit = g("in-ti-unit") ? bacaAngka(g("in-ti-unit").value) : null;
  const semua = g("in-ti-semua") && g("in-ti-semua").checked;
  if (!n || isNaN(n) || n <= 0){ err.textContent = "Isi nominal yang benar."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)){ err.textContent = "Isi tanggal."; return; }
  if (unit != null && (isNaN(unit) || unit < 0)){ err.textContent = "Jumlah satuan belum benar."; return; }
  if (f.tipe === "beli" && dompetId && n > saldoDompet(dompetId)){ err.textContent = "Saldo dompet tidak cukup (" + rupiah(saldoDompet(dompetId)) + ")."; return; }
  if (f.tipe === "jual" && a.unit && unit > a.unit){ err.textContent = "Jumlahnya lebih dari yang dimiliki (" + fmtAngka(a.unit) + " " + a.satuan + ")."; return; }
  const sebelum = a.nilai, label = "Investasi " + a.nama;
  if (f.tipe === "beli"){
    const txId = dompetId ? buatTxTerkait(dompetId, null, n, tgl, "Tambah " + a.nama, {jenis:"inv", id:a.id, label}) : null;
    a.modal += n; a.nilai += n; if (unit) a.unit = (a.unit || 0) + unit;
    catatRiwayat(a, {tgl, tipe:"beli", nominal:n, unit:unit || 0, sebelum, sesudah:a.nilai, txId});
  } else if (f.tipe === "jual"){
    const porsi = semua ? 1 : Math.min(1, unit && a.unit ? unit / a.unit : sebelum ? n / sebelum : 1);
    const modalKeluar = Math.round(a.modal * porsi), realisasi = n - modalKeluar;
    const txId = dompetId ? buatTxTerkait(null, dompetId, n, tgl, "Cairkan " + a.nama, {jenis:"inv", id:a.id, label}) : null;
    a.modal -= modalKeluar;
    a.nilai = semua ? 0 : Math.max(0, Math.round(sebelum * (1 - porsi)));
    if (unit) a.unit = Math.max(0, (a.unit || 0) - unit);
    if (semua){ a.unit = 0; a.modal = 0; a.tutup = hariIni(); }
    catatRiwayat(a, {tgl, tipe:"jual", nominal:n, unit:unit || 0, sebelum, sesudah:a.nilai, realisasi, txId});
  } else {
    const k = katNama("Hasil investasi"), now = new Date().toISOString(), id = uid();
    d.transaksi.push({id, jenis:"masuk", nominal:n, kategoriId:k ? k.id : null, sub:(JENIS_INV[a.jenis] || JENIS_INV.lain)[0], dompetId, keDompetId:null, tanggal:tgl, catatan:"Hasil " + a.nama, fotoId:null, dibuat:now, diubah:now});
    catatRiwayat(a, {tgl, tipe:"hasil", nominal:n, txId:id});
  }
  a.nilaiTgl = hariIni();
  await simpanPribadi(); tutupModal(); render();
  toast(f.tipe === "beli" ? "Garu: " + rupiah(n) + " ditambahkan ke " + a.nama + "." : f.tipe === "jual" ? "Garu: pencairan dicatat." + (a.tutup ? " Investasi ditutup." : "") : "Garu: hasil " + rupiah(n) + " masuk sebagai pemasukan.");
}

    '<div class="nilai-list">'+baris+'</div>'+
    '<p style="font-weight:800" id="nilai-total"></p>'+
    '<p class="err" id="err-nilai" role="alert"></p>'+

  const hitungBaris = () => {

      const a = invById(inp.dataset.id), v = inp.dataset.unit === "1" ? bacaAngka(inp.value) : hitung(inp.value);
      const el = document.querySelector('.nilai-delta[data-untuk="'+a.id+'"]');
      if (v == null || isNaN(v)){ el.textContent = "Format belum benar"; el.className = "nilai-delta turun"; return; }
      const baru = inp.dataset.unit === "1" ? Math.round(v * a.unit) : v, dl = baru - a.nilai;
      tot += dl;
      el.textContent = dl ? (inp.dataset.unit === "1" ? rupiah(baru) + " · " : "") + fmtDelta(dl) + (a.nilai ? " (" + fmtPct(dl / a.nilai * 100) + ")" : "") : "Tidak berubah";
      el.className = "nilai-delta " + kelasNaik(dl);

  };
  document.querySelectorAll(".in-nilai-inv").forEach(i => i.addEventListener("input", hitungBaris));

async function simpanNilaiInv(){
  const err = document.getElementById("err-nilai"), hasil = [];
  for (const inp of document.querySelectorAll(".in-nilai-inv")){
    const a = invById(inp.dataset.id), v = inp.dataset.unit === "1" ? bacaAngka(inp.value) : hitung(inp.value);
    if (v == null || isNaN(v) || v < 0){ err.textContent = "Nilai " + a.nama + " belum benar."; return; }
    hasil.push([a, inp.dataset.unit === "1" ? Math.round(v * a.unit) : v, inp.dataset.unit === "1" ? Math.round(v) : null]);
  }
  let tot = 0, n = 0;
  hasil.forEach(([a, baru, hu]) => {
    if (hu) a.hargaUnit = hu;
    if (baru !== a.nilai){ catatRiwayat(a, {tgl:hariIni(), tipe:"nilai", sebelum:a.nilai, sesudah:baru}); tot += baru - a.nilai; n++; a.nilai = baru; }
    a.nilaiTgl = hariIni();
  });
  const st = statistik(); st.invUpdate = st.invUpdate || []; if (!st.invUpdate.includes(hariIni())) st.invUpdate.push(hariIni());
  await simpanPribadi(); tutupModal(); render();
  toast(n ? "Garu: " + n + " nilai diperbarui, total " + fmtDelta(tot) + "." : "Garu: semua nilai tetap. Tercatat sudah dicek hari ini.");
}
/* pengingat mingguan (bawaan Jumat 19.00) */
const kIngatInv = id => PFX + "ingatInv." + id;
function jadwalInvTerakhir(ic){
  const now = new Date(), dow = now.getDay(), selisih = (dow - ic.hari + 7) % 7;
  let t = tambahHari(hariIni(), -selisih);
  if (selisih === 0 && jamSekarang() < ic.jam) t = tambahHari(t, -7);
  return t;
}
function perluUpdateInv(){
  if (!S.sesi) return false;
  const ic = S.sesi.data.pengaturan.ingatInv, list = invAktif();
  if (!ic.aktif || !list.length) return false;
  const t = jadwalInvTerakhir(ic);
  return list.some(a => (a.nilaiTgl || "") < t && (a.dibuat || "") < t);
}
function tulisIngatInv(){
  if (!S.sesi) return;
  const ic = S.sesi.data.pengaturan.ingatInv;
  tulisJson(kIngatInv(S.sesi.user.id), {aktif:!!ic.aktif && invAktif().length > 0, hari:ic.hari, jam:ic.jam, sudah:perluUpdateInv() ? "" : jadwalInvTerakhir(ic)});
}
function cekIngatInv(){
  if (!S.meta || !S.meta.pengguna) return;
  const log = bacaJson(K_NOTIF) || {}, h = hariIni(); let ubah = false;
  S.meta.pengguna.forEach(u => {
    const x = bacaJson(kIngatInv(u.id));
    if (!x || !x.aktif) return;
    const t = jadwalInvTerakhir(x);
    if (S.sesi && S.sesi.user.id === u.id){ if (!perluUpdateInv()) return; }
    else if (x.sudah >= t) return;
    const k = u.id + ":inv:" + t;
    if (log[k]) return;
    log[k] = h; ubah = true;
    kirimNotif("Garu untuk " + u.nama, "Waktunya update nilai investasi mingguan. Buka Dompet Kita, cuma butuh semenit.");
    if (S.sesi && S.sesi.user.id === u.id){ toast("Garu: waktunya update nilai investasi mingguan!"); if (S.halaman === "beranda" && !document.querySelector(".backdrop")) render(); }
  });
  if (ubah){
    /* log notifikasi dibersihkan harian oleh cekPengingat; kunci mingguan disimpan ulang setiap hari */
    tulisJson(K_NOTIF, log);
  }
}
setInterval(cekIngatInv, 60000);

const IURAN_KES = {1:150000, 2:100000, 3:35000};
const PEMBAYAR_BPJS = {pbi:"Dibayar pemerintah (PBI)", kantor:"Dari kantor (dipotong gaji)", mandiri:"Mandiri (bayar sendiri)"};
const DISKON_TK = {tidak:["Tidak ada", null, null], bpu:["Diskon 50% JKK & JKM, BPU umum (April–Desember 2026)", "2026-04", "2026-12"], transport:["Diskon 50% JKK & JKM, BPU transportasi (Januari 2026–Maret 2027)", "2026-01", "2027-03"]};
const namaBpjs = b => (b.program === "kes" ? "BPJS Kesehatan" : "BPJS Ketenagakerjaan") + (b.pembayar === "mandiri" ? " (mandiri)" : b.pembayar === "kantor" ? " (kantor)" : " (PBI)");
function iuranBpjs(b, kb){
  if (b.pembayar !== "mandiri") return null;
  if (b.program === "kes"){
    const per = b.iuranOrang || IURAN_KES[b.kelas] || 0, tot = per * (b.orang || 1);
    return {proteksi:tot, jht:0, total:tot, rincian:[["Kelas " + b.kelas + " · " + rupiah(per) + " × " + (b.orang || 1) + " orang", tot]]};
  }
  const dsr = b.dasar || 1000000, ds = DISKON_TK[b.diskon || "tidak"], diskon = ds[1] && kb >= ds[1] && kb <= ds[2];
  let jkk = Math.round(dsr * 0.01), jkm = 6800;
  if (diskon){ jkk = Math.round(jkk / 2); jkm = jkm / 2; }
  const jht = b.ikutJht ? Math.round(dsr * 0.02) : 0;
  return {proteksi:jkk + jkm, jht, total:jkk + jkm + jht, rincian:[["JKK 1%" + (diskon ? " (diskon 50%)" : ""), jkk], ["JKM" + (diskon ? " (diskon 50%)" : ""), jkm]].concat(jht ? [["JHT 2% (masuk tabungan JHT)", jht]] : [])};
}
function jatuhBpjs(b){
  if (b.pembayar !== "mandiri") return null;
  const kb = b.lunasSampai ? geserBulan(b.lunasSampai, 1) : periode(hariIni()).slice(0, 7);
  return kb + "-" + pad2(Math.min(b.batas || 10, hariDalamBulan(kb)));
}
function statusBpjs(b){

  return {kode:"aktif", label:"Aktif", chip:"background:var(--green-bg);color:var(--hijau-teks)", h, due};

const JENIS_ASET = {
  rumah:["Rumah", "naik", 3, [["PBB", 12]]], tanah:["Tanah", "naik", 5, [["PBB", 12]]],

const asetById = id => S.sesi.data.aset.find(a => a.id === id);
function nilaiAset(a){
  if (a.mode === "manual") return a.nilaiManual || 0;
  const th = Math.max(0, hariAntara(a.tglBeli || hariIni(), hariIni()) / 365.25), p = (a.persen || 0) / 100;
  return Math.max(0, Math.round(a.hargaBeli * Math.pow(a.arah === "naik" ? 1 + p : 1 - p, th)));
}
function sisaCicilanAset(a){
  const c = a.cicilan; if (!c) return 0;
  if (c.tipe === "utang"){ const u = S.sesi.data.utang.find(x => x.id === c.id); return u ? Math.max(0, sisaUtang(u)) : 0; }
  const r = S.sesi.data.rutin.find(x => x.id === c.id);
  if (!r || !r.tenor) return 0;
  migrasiRutin(r);
  return Math.max(0, r.tenor - r.dicatatTgl.length) * r.nominal;
}
const totalAset = () => S.sesi.data.aset.filter(a => !a.dijual).reduce((s, a) => s + nilaiAset(a), 0);
function hitungKekayaan(){
  const d = S.sesi.data;
  const uang = totalSaldo(), tab = totalTabPribadi(), inv = totalInvestasi(), aset = totalAset();
  const piutang = d.utang.filter(u => u.jenis === "piutang").reduce((s, u) => s + Math.max(0, sisaUtang(u)), 0);
  const utang = d.utang.filter(u => u.jenis === "utang").reduce((s, u) => s + Math.max(0, sisaUtang(u)), 0);
  const cicil = d.rutin.filter(r => r.jenis === "keluar" && r.tenor).reduce((s, r) => { migrasiRutin(r); return s + Math.max(0, r.tenor - r.dicatatTgl.length) * r.nominal; }, 0);
  return {uang, tab, inv, aset, piutang, utang, cicil, bersih:uang + tab + inv + aset + piutang - utang - cicil};
}

  const g = i => document.getElementById(i);
  const mode = () => (document.querySelector('input[name="as-mode"]:checked') || {}).value;
  const atur = () => {
    document.querySelectorAll('input[name="as-mode"]').forEach(r => r.parentElement.classList.toggle("on", r.checked));
    g("as-oto").hidden = mode() !== "otomatis"; g("as-man").hidden = mode() !== "manual";
    const h = hitung(g("in-as-harga").value), tgl = g("in-as-tgl").value;
    if (mode() === "otomatis" && h && tgl){
      const tmp = {mode:"otomatis", hargaBeli:h, tglBeli:tgl, arah:g("in-as-arah").value, persen:Number(g("in-as-persen").value) || 0};
      g("as-perkiraan").textContent = "Perkiraan nilai sekarang: " + rupiah(nilaiAset(tmp)) + ". Bisa diganti ke isi manual kapan saja.";
    } else g("as-perkiraan").textContent = "Isi tanggal dan harga beli untuk melihat perkiraannya.";
  };
  g("in-as-jenis").addEventListener("change", () => { const j = JENIS_ASET[g("in-as-jenis").value]; if (!a){ g("in-as-arah").value = j[1]; g("in-as-persen").value = j[2]; } atur(); });
  ["in-as-harga", "in-as-tgl", "in-as-arah", "in-as-persen"].forEach(i => { g(i).addEventListener("input", atur); g(i).addEventListener("change", atur); });
  document.querySelectorAll('input[name="as-mode"]').forEach(r => r.addEventListener("change", atur));
  atur();
}
async function simpanAset(){
  const f = S.formAset, d = S.sesi.data, err = document.getElementById("err-as"), g = i => document.getElementById(i);
  const nama = g("in-as-nama").value.trim(), jenis = g("in-as-jenis").value, mode = document.querySelector('input[name="as-mode"]:checked').value;
  const hv = g("in-as-harga").value.trim(), harga = hv ? hitung(hv) : 0, tglBeli = g("in-as-tgl").value;
  if (!nama){ err.textContent = "Isi nama asetnya."; return; }
  if (harga == null || isNaN(harga) || harga < 0){ err.textContent = "Harga beli belum benar."; return; }
  const rec = {nama, jenis, mode, hargaBeli:harga, tglBeli, arah:g("in-as-arah").value, persen:Number(g("in-as-persen").value) || 0};
  if (mode === "otomatis" && (!harga || !tglBeli)){ err.textContent = "Untuk hitung otomatis, isi tanggal dan harga beli."; return; }
  if (rec.persen < 0 || rec.persen > 80){ err.textContent = "Persen per tahun harus 0–80."; return; }
  if (mode === "manual"){
    const nv = nilaiUang("in-as-nilai");
    if (nv == null || isNaN(nv) || nv < 0){ err.textContent = "Isi nilai sekarang."; return; }
    rec.nilaiManual = nv; rec.nilaiTgl = hariIni();
  }
  const c = g("in-as-cicil").value;
  rec.cicilan = c ? {tipe:c.split(":")[0], id:c.split(":")[1]} : null;
  if (g("in-as-jual")) rec.dijual = g("in-as-jual").checked ? (asetById(f.id).dijual || hariIni()) : null;
  const a = f.id ? asetById(f.id) : null;
  if (a) Object.assign(a, rec); else d.aset.push(Object.assign({id:uid(), kewajiban:[], dibuat:hariIni()}, rec));
  await simpanPribadi(); tutupModal(); render();
  toast(a ? "Aset diperbarui." : "Mang Kelo mencatat " + nama + "." + (JENIS_ASET[jenis][3].length ? " Tambahkan pengingat " + JENIS_ASET[jenis][3][0][0] + " di kartunya ya." : ""));
}

async function simpanKewajiban(){
  const f = S.formKw, a = asetById(f.asetId), err = document.getElementById("err-kw2");
  const nama = document.getElementById("in-kw-nama2").value.trim(), tgl = document.getElementById("in-kw-tgl").value;
  const setiap = Number(document.getElementById("in-kw-setiap").value), nv = document.getElementById("in-kw-nom").value.trim(), nominal = nv ? hitung(nv) : 0;
  if (!nama){ err.textContent = "Isi nama pengingatnya."; return; }
  if (!/^\d{4}-\d{2}-\d{2}$/.test(tgl)){ err.textContent = "Isi tanggal jatuh tempo berikutnya."; return; }
  if (nominal == null || isNaN(nominal) || nominal < 0){ err.textContent = "Perkiraan biaya belum benar."; return; }
  a.kewajiban = a.kewajiban || [];
  const k = f.kid ? a.kewajiban.find(x => x.id === f.kid) : null;
  if (k) Object.assign(k, {nama, tgl, setiap, nominal}); else a.kewajiban.push({id:uid(), nama, tgl, setiap, nominal});

function tambahBulan(tgl, n){ const p = tgl.split("-").map(Number), kb = geserBulan(p[0] + "-" + pad2(p[1]), n); return kb + "-" + pad2(Math.min(p[2], hariDalamBulan(kb))); }
function bayarKewajiban(asetId, kid){

function majukanKewajiban(x){
  const a = asetById(x.asetId), k = a && (a.kewajiban || []).find(y => y.id === x.kid);

  k.terakhir = hariIni();

}

function pengingat8(){
  const out = [];
  S.sesi.data.bpjs.forEach(b => {
    const st = statusBpjs(b);
    if (st.due && st.h <= 7){ const iu = iuranBpjs(b, geserBulan(b.lunasSampai || periode(hariIni()), 1));
      out.push({kunci:"b:" + b.id + ":" + st.due, jenis:"bpjs", b, nama:"Iuran " + namaBpjs(b), nominal:iu ? iu.total : null, due:st.due, h:st.h}); }
  });
  kewajibanAset().forEach(x => { if (x.h <= 14) out.push({kunci:"k:" + x.k.id + ":" + x.k.tgl, jenis:"aset", a:x.a, k:x.k, nama:x.k.nama + " · " + x.a.nama, nominal:x.k.nominal || 0, due:x.k.tgl, h:x.h}); });
  return out;
}
function jadwal8(j){

    document.getElementById("app").innerHTML = '<main class="center-screen"><div class="card welcome">'+maskot("niko", 100)+'<h1>Browser belum didukung</h1><p class="muted">Buka Dompet Kita dengan Google Chrome atau Microsoft Edge versi terbaru.</p></div></main>';
    return;
  }
  try { localStorage.setItem(PFX + "tes", "1"); localStorage.removeItem(PFX + "tes"); }
  catch(e){
    document.getElementById("app").innerHTML = '<main class="center-screen"><div class="card welcome">'+maskot("niko", 100)+'<h1>Penyimpanan diblokir</h1><p class="muted">Izinkan penyimpanan data situs di pengaturan browser, lalu muat ulang halaman ini.</p></div></main>';
    return;
  }
  S.meta = bacaJson(K_META);
  if (S.meta && S.meta.pengguna){
    let ubah = false;
    S.meta.pengguna.forEach(u => { if (ALIAS[u.avatar]){ u.avatar = ALIAS[u.avatar]; ubah = true; } });

}
