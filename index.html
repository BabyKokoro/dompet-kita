/* ---------- Sidik jari / Face ID (Tarsi), WebAuthn PRF ---------- */
S.bioDukung = null;
async function cekDukungBio(){
  if (!window.PublicKeyCredential || !window.isSecureContext || !navigator.credentials) return false;
  try { if (PublicKeyCredential.getClientCapabilities){ const c = await PublicKeyCredential.getClientCapabilities(); if (c && c["extension:prf"] === false) return false; } } catch(e){}
  try { return await PublicKeyCredential.isUserVerifyingPlatformAuthenticatorAvailable(); } catch(e){ return false; }
}
cekDukungBio().then(v => {
  S.bioDukung = v && localStorage.getItem(PFX + "bioTidak") !== "1";
  if (S.sesi && S.halaman === "pengaturan" && !document.querySelector(".backdrop")) render();
  if (S.layar === "login" && !S.sesi) perbaruiTombolBio();
});
async function kunciDariPrf(buf){
  const dasar = await crypto.subtle.importKey("raw", buf, "HKDF", false, ["deriveKey"]);
  return crypto.subtle.deriveKey({name:"HKDF", hash:"SHA-256", salt:new Uint8Array(32), info:te.encode("dompet-kita-bio-v1")}, dasar, {name:"AES-GCM", length:256}, false, ["encrypt","decrypt"]);
}
async function prfDari(credId, salt){
  const a = await navigator.credentials.get({publicKey:{challenge:crypto.getRandomValues(new Uint8Array(32)), rpId:location.hostname,
    allowCredentials:[{type:"public-key", id:credId}], userVerification:"required", timeout:60000, extensions:{prf:{eval:{first:salt}}}}});
  const r = a.getClientExtensionResults();
  if (!r.prf || !r.prf.results || !r.prf.results.first) throw new Error("prf");
  return r.prf.results.first;
}
async function aktifkanBio(){
  const u = penggunaSaya(), salt = crypto.getRandomValues(new Uint8Array(32));
  let cred;
  try {
    cred = await navigator.credentials.create({publicKey:{
      rp:{name:"Dompet Kita", id:location.hostname},
      user:{id:crypto.getRandomValues(new Uint8Array(16)), name:u.nama + " · Dompet Kita", displayName:u.nama},
      challenge:crypto.getRandomValues(new Uint8Array(32)),
      pubKeyCredParams:[{type:"public-key", alg:-7}, {type:"public-key", alg:-257}],
      authenticatorSelection:{authenticatorAttachment:"platform", userVerification:"required", residentKey:"preferred"},
      timeout:60000, attestation:"none", extensions:{prf:{eval:{first:salt}}}}});
  } catch(e){ toast(e && e.name === "NotAllowedError" ? "Tarsi: pendaftaran dibatalkan." : "Tarsi belum bisa mendaftarkan sidik jari di perangkat ini."); return; }
  try {
    const ext = cred.getClientExtensionResults();
    if (!ext.prf || ext.prf.enabled === false) throw new Error("prf");
    let out = ext.prf.results && ext.prf.results.first;
    if (!out){ toast("Tarsi: pindai sekali lagi untuk memastikan."); out = await prfDari(cred.rawId, salt); }
    const k = await kunciDariPrf(out);
    localStorage.setItem(kBio(u.id), JSON.stringify({credId:keB64(cred.rawId), salt:keB64(salt), dek:await bungkusKunci(k, S.sesi.dek), bersama:await bungkusKunci(k, S.sesi.kunciBersama), dibuat:new Date().toISOString()}));
    render(); toast("Tarsi siap. Sekarang kamu bisa masuk dengan sidik jari atau wajah di perangkat ini.");
  } catch(e){
    localStorage.setItem(PFX + "bioTidak", "1"); S.bioDukung = false; render();
    toast("Perangkat ini belum mendukung buka kunci sidik jari yang aman. Tetap pakai PIN ya.");
  }
}
async function bukaDenganBio(u){
  const rec = bioSaya(u.id);
  if (!rec) throw new Error("tidak ada");
  const k = await kunciDariPrf(await prfDari(dariB64(rec.credId), dariB64(rec.salt)));
  return {dek:await bukaKunci(k, rec.dek), kunciBersama:await bukaKunci(k, rec.bersama)};
}
function perbaruiTombolBio(){
  const w = document.getElementById("bio-wadah");

  const u = S.meta && S.meta.pengguna.find(x => x.id === S.loginId);

function cekBlokirPulih(u, err){
  const b = infoBlokir("pulih." + u.id);
  if (b.sampai > Date.now()){ err.textContent = "Terlalu banyak salah. Coba lagi dalam " + Math.ceil((b.sampai - Date.now()) / 60000) + " menit."; return true; }
  return false;
}
function gagalPulih(u, err, pesan){
  const g = catatGagal("pulih." + u.id);
  err.textContent = g.sampai > Date.now() ? "Terlalu banyak salah. Coba lagi dalam " + Math.ceil((g.sampai - Date.now()) / 60000) + " menit." : pesan + " Sisa " + Math.max(0, BATAS_SALAH - g.gagal) + " percobaan sebelum dijeda.";
}

async function cekPulihKode(){
  const u = S.meta.pengguna.find(x => x.id === S.loginId), err = document.getElementById("err-pulih");

function alurPinBaru(u, kunci, cara){
  const alur = {langkah:"baru", baru:""};
  function tampil(pesan){
    const m = bukaModal(maskot("lupi", 76)+'<h2 id="judul-modal">'+(alur.langkah === "baru" ? "Buat PIN baru" : "Ulangi PIN baru")+'</h2>'+
      '<p class="muted" style="font-size:14px">'+(alur.langkah === "baru" ? "Berhasil! Sekarang buat PIN baru untuk " + esc(u.nama) + "." : "Ketik sekali lagi untuk memastikan.")+'</p>'+pinpadHTML(), "center");
    const api = pasangPinpad(m, async (pin, api) => {
      if (alur.langkah === "baru"){
        if (pinLemah(pin)){ api.ulang("PIN terlalu mudah ditebak."); return; }
        alur.baru = pin; alur.langkah = "ulang"; tampil(); return;
      }
      if (pin !== alur.baru){ alur.langkah = "baru"; alur.baru = ""; tampil("PIN tidak sama. Buat lagi ya."); return; }
      api.pesan("Menyimpan PIN baru...", true);
      const salt = saltBaru(), kek = await kunciDariPin(pin, salt, ITERASI);
      u.salt = salt; u.iterasi = ITERASI;
      u.dek = await bungkusKunci(kek, kunci.dek);
      u.bersama = await bungkusKunci(kek, kunci.kunciBersama);
      const catat = {waktu:new Date().toISOString(), cara, perangkat:jenisPerangkat(), perangkatId:idPerangkatTetap(), lokasi:kodeLokasi(lokasiSaya())};
      u.riwayatPulih = (u.riwayatPulih || []).concat([catat]).slice(-10);
      if (cara === "kode"){ u.pulih = Object.assign({}, u.pulih); delete u.pulih.kode; S.mintaKodeBaru = true; }
      simpanMeta();
      localStorage.setItem(PFX + "pulihDilihat." + u.id, catat.waktu);
      resetGagal(u.id); localStorage.removeItem(kBlokir("pulih." + u.id));
      tutupModal();
      await masukDenganKunci(u, kunci);
      toast("PIN baru tersimpan. Selamat datang kembali, " + u.nama + "!");
    });
    if (pesan) api.pesan(pesan);
  }
  tampil();
}
/* beri tahu kalau PIN dipulihkan dari perangkat lain */
function cekPemberitahuanPulih(u){
  const r = (u.riwayatPulih || []).slice(-1)[0];
  if (!r) return;
  const k = PFX + "pulihDilihat." + u.id, dilihat = localStorage.getItem(k) || "";
  if (r.waktu <= dilihat) return;
  localStorage.setItem(k, r.waktu);
  if (r.perangkatId === idPerangkatTetap()) return;
  setTimeout(() => {
    if (!S.sesi) return;
    bukaModal(maskot("lupi", 80)+'<h2 id="judul-modal">PIN-mu pernah dipulihkan</h2>'+
      '<p>Lewat <strong>'+esc(NAMA_CARA[r.cara] || r.cara)+'</strong> pada <strong>'+fmtWaktuPanjang(r.waktu)+'</strong> di '+esc(r.perangkat || "perangkat lain")+(r.lokasi ? ', '+lokasiKodeHTML(r.lokasi, 12) : '')+'.</p>'+
      '<p class="note" style="font-size:14px;text-align:left">Kalau itu kamu, abaikan saja. Kalau bukan, segera ganti PIN, lalu ganti kode pemulihan dan pertanyaan keamananmu di Pengaturan.</p>'+
      '<div class="row-btn">'+tombolAksi("tutup-modal", "Itu aku")+tombolAksi("ganti-pin", "Bukan aku, ganti PIN", "btn-primary")+'</div>', "center");
  }, 900);
}

/* ============ Langkah 13 (v1.4.2): anggaran acara, bagikan bukti transfer, hapus beberapa transaksi ============ */

/* ---------- Anggaran acara (Cici) ---------- */
const acaraP = () => (S.sesi.data.acara = S.sesi.data.acara || []);
const acaraB = () => (S.sesi.bersama.acara = S.sesi.bersama.acara || []);
const cariAcara = (id, bersama) => (bersama ? acaraB() : acaraP()).find(a => a.id === id);
function statusAcara(a){ const h = tglLokal(); return h < a.mulai ? "akan" : h > a.selesai ? "selesai" : "berjalan"; }
const fmtTglPendekAcara = t => new Date(t + "T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"short", year:"numeric"});
function pakaiAcara(a, bersama){
  if (!bersama) return S.sesi.data.transaksi.filter(t => t.jenis === "keluar" && t.acaraId === a.id && !t.acaraBersama)
    .map(t => ({id:t.id, oleh:S.sesi.user.id, nominal:t.nominal, tanggal:t.tanggal, kategori:(kat(t.kategoriId) || {}).nama || "Lainnya", catatan:t.catatan || ""}));
  const dariTx = (a.pakai || []).map(p => Object.assign({}, p));
  const dariDber = S.sesi.bersama.mutasi.filter(m => m.jenis === "pakai" && m.acaraId === a.id)
    .map(m => ({id:m.id, oleh:m.oleh, nominal:Math.abs(m.nominal), tanggal:m.tanggal, kategori:m.kategori || "Belanja bersama", catatan:m.catatan || "", dber:true}));
  return dariTx.concat(dariDber);
}
const totalPakaiAcara = (a, b) => pakaiAcara(a, b).reduce((s, p) => s + p.nominal, 0);
function namaAcaraTx(t){ const a = t.acaraId ? cariAcara(t.acaraId, !!t.acaraBersama) : null; return a ? a.nama : ""; }
/* catatan belanja ke acara berdua disalin ke brankas bersama supaya pasangan ikut melihat */
function sinkronPakaiBersama(rec, hapus){
  let ubah = false;
  acaraB().forEach(a => {
    const i = (a.pakai || []).findIndex(p => p.id === rec.id);
    if (i >= 0 && (hapus || !(rec.jenis === "keluar" && rec.acaraBersama && rec.acaraId === a.id))){ a.pakai.splice(i, 1); ubah = true; }
  });
  if (!hapus && rec.jenis === "keluar" && rec.acaraBersama){
    const a = cariAcara(rec.acaraId, true);
    if (a){
      a.pakai = a.pakai || [];
      const e = {id:rec.id, oleh:S.sesi.user.id, nominal:rec.nominal, tanggal:rec.tanggal, kategori:(kat(rec.kategoriId) || {}).nama || "Lainnya", catatan:rec.catatan || ""};
      const i = a.pakai.findIndex(p => p.id === rec.id);
      if (i >= 0){ if (kanon(a.pakai[i]) !== kanon(e)){ a.pakai[i] = e; ubah = true; } } else { a.pakai.push(e); ubah = true; }
    }
  }
  return ubah;
}
function acaraUntukTanggal(tgl, pilihId){
  const cocok = x => (x.a.mulai <= tgl && tgl <= x.a.selesai) || statusAcara(x.a) !== "selesai" || x.a.id === pilihId;
  return acaraP().map(a => ({a, b:false})).concat(acaraB().map(a => ({a, b:true}))).filter(cocok).sort((x, y) => x.a.mulai.localeCompare(y.a.mulai));
}
function acaraFieldHTML(f){
  if (f.jenis !== "keluar") return "";
  const list = acaraUntukTanggal(f.tanggal || tglLokal(), f.acaraId);
  if (!list.length) return "";
  const nilai = f.acaraId ? (f.acaraBersama ? "b:" : "p:") + f.acaraId : "";
  const op = x => '<option value="'+(x.b ? "b:" : "p:")+x.a.id+'"'+(nilai === (x.b ? "b:" : "p:") + x.a.id ? " selected" : "")+'>'+esc(x.a.nama)+(x.b ? " (berdua)" : "")+'</option>';
  return '<label class="field">Masuk anggaran acara (opsional)<select id="in-acara"><option value="">Tidak ada</option>'+list.map(op).join("")+'</select></label>'+
    '<p class="muted acara-cat" style="font-size:12px;margin-top:-6px">Belanja yang masuk acara berdua terlihat oleh pasangan: nominal, kategori, dan catatannya.</p>';
}
function bacaAcaraForm(f){
  const el = document.getElementById("in-acara");
  if (!el) return;
  const v = el.value;
  f.acaraId = v ? v.slice(2) : null; f.acaraBersama = v.startsWith("b:");
}
function cekTeguranCici(rec, sebelum){
  if (!rec || rec.jenis !== "keluar" || !rec.acaraId) return;
  const a = cariAcara(rec.acaraId, !!rec.acaraBersama);
  if (!a || !a.anggaran) return;
  const p1 = sebelum / a.anggaran * 100, p2 = totalPakaiAcara(a, !!rec.acaraBersama) / a.anggaran * 100;
  let pesan = "";
  if (p2 >= 100 && p1 < 100) pesan = "Anggaran acara " + a.nama + " sudah lewat batas (" + Math.round(p2) + "%).";
  else if (p2 >= BATAS_AWAS && p1 < BATAS_AWAS) pesan = "Anggaran acara " + a.nama + " sudah terpakai " + Math.round(p2) + "%. Sisa " + rupiah(a.anggaran - totalPakaiAcara(a, !!rec.acaraBersama)) + ".";
  if (pesan) setTimeout(() => toast("Cici: " + pesan), 2400);
}
function kartuAcara(a, bersama){
  const pakai = totalPakaiAcara(a, bersama), pct = a.anggaran ? pakai / a.anggaran * 100 : 0, st = statusAcara(a);
  const sisaHari = hariAntara(tglLokal(), a.selesai);
  const chipSt = st === "akan" ? '<span class="rchip" style="background:var(--tint);color:var(--chip-teks)">Mulai '+fmtTglPendekAcara(a.mulai)+'</span>'
    : st === "berjalan" ? '<span class="rchip" style="background:var(--green-bg);color:var(--hijau-teks)">Berlangsung'+(sisaHari > 0 ? " · " + sisaHari + " hari lagi" : " · hari terakhir")+'</span>'
    : '<span class="rchip" style="background:var(--tint);color:var(--chip-teks)">Selesai</span>';
  const warna = pct >= 100 ? "#C4574B" : pct >= BATAS_AWAS ? "#D9A441" : "#6F8F5E";
  return '<article class="card tab-kartu acara-kartu"><div class="ang-head"><h3>'+esc(a.nama)+'</h3>'+(bersama ? '<span class="chip">Berdua</span>' : '')+
      '<button type="button" class="btn-ikon" data-aksi="ubah-acara" data-id="'+a.id+'" data-b="'+(bersama ? 1 : 0)+'" aria-label="Ubah acara '+esc(a.nama)+'">'+ikon("ubah")+'</button></div>'+
    '<p class="muted" style="font-size:13px">'+fmtTglPendekAcara(a.mulai)+(a.selesai !== a.mulai ? ' sampai '+fmtTglPendekAcara(a.selesai) : '')+(a.catatan ? ' · ' + esc(a.catatan) : '')+'</p>'+
    '<div>'+chipSt+'</div>'+
    '<div class="ang-angka"><strong>'+rupiah(pakai)+'</strong><span class="muted"> dari '+rupiah(a.anggaran)+'</span></div>'+
    bar(Math.min(100, pct), warna)+
    '<p style="font-size:14px;font-weight:800;color:'+(pakai > a.anggaran ? "var(--red)" : "inherit")+'">'+(pakai > a.anggaran ? "Lewat " + rupiah(pakai - a.anggaran) : "Sisa " + rupiah(a.anggaran - pakai))+'</p>'+
    '<div class="row-btn" style="justify-content:flex-start">'+tombolAksi("rinci-acara", "Lihat rincian", "btn-ghost btn-kecil", ' data-id="'+a.id+'" data-b="'+(bersama ? 1 : 0)+'"')+
      (st !== "selesai" ? tombolAksi("tx-acara", ikon("plus") + "Catat belanja", "btn-primary btn-kecil", ' data-id="'+a.id+'" data-b="'+(bersama ? 1 : 0)+'"') : '')+
      (S.meta.pengguna.length >= 2 ? tombolAksi("ob-kirim-acara", maskot("boo", 22) + "Kirim ke obrolan", "btn-ghost btn-kecil btn-ob", ' data-id="'+a.id+'" data-b="'+(bersama ? 1 : 0)+'"') : '')+'</div></article>';
}
function seksiAcara(){
  const semua = acaraP().map(a => ({a, b:false})).concat(acaraB().map(a => ({a, b:true})));
  const aktif = semua.filter(x => statusAcara(x.a) !== "selesai").sort((x, y) => x.a.mulai.localeCompare(y.a.mulai));
  const lewat = semua.filter(x => statusAcara(x.a) === "selesai").sort((x, y) => y.a.selesai.localeCompare(x.a.selesai));
  return '<section class="card set-sec" id="seksi-acara"><div class="page-head" style="margin:0"><div class="card-head" style="margin:0">'+maskot("cici", 56)+
      '<div><h2>Anggaran acara</h2><p class="muted" style="font-size:14px">Batas belanja khusus untuk satu acara, misalnya Lebaran, nikahan teman, atau liburan.</p></div></div>'+
      tombolAksi("tambah-acara", ikon("plus") + "Acara baru", "btn-primary")+'</div>'+
    (aktif.length ? '<div class="ang-grid">'+aktif.map(x => kartuAcara(x.a, x.b)).join("")+'</div>'
      : '<p class="muted">Belum ada acara yang berjalan. Buat acara, lalu tandai belanjanya saat mencatat transaksi.</p>')+
    (lewat.length ? '<details class="acara-lewat"><summary>Acara yang sudah selesai ('+lewat.length+')</summary><div class="ang-grid" style="margin-top:12px">'+lewat.map(x => kartuAcara(x.a, x.b)).join("")+'</div></details>' : '')+
  '</section>';
}
function kartuAcaraBeranda(){
  const jalan = acaraP().map(a => ({a, b:false})).concat(acaraB().map(a => ({a, b:true}))).filter(x => statusAcara(x.a) === "berjalan").slice(0, 3);
  if (!jalan.length) return "";

async function simpanAcara(){
  const f = S.formAcara, err = document.getElementById("err-acara");

async function ambilBagikan(){
  try {
    if (!("caches" in window)) return {foto:null, teks:""};
    const c = await caches.open("dompet-kita-bagikan");
    const rf = await c.match("foto"), rt = await c.match("teks");
    const hasil = {foto:rf ? await rf.blob() : null, teks:rt ? await rt.text() : ""};
    await c.delete("foto"); await c.delete("teks");
    return hasil;
  } catch(e){ return {foto:null, teks:""}; }
}
function nominalDariTeks(teks){
  const m = String(teks || "").match(/(?:Rp|IDR)\s*\.?\s*([\d][\d.,]*)/i);
  if (!m) return null;
  const n = hitung(m[1].replace(/[.,]\d{2}$/, ""));
  return n && !isNaN(n) && n > 0 ? n : null;
}
async function bukaDariBagikan(){

let snackTimer = null;
function snack(teks, label, aksi){
  document.querySelectorAll(".snack").forEach(x => x.remove());
  clearTimeout(snackTimer);
  const el = document.createElement("div");
  el.className = "snack"; el.setAttribute("role", "status");

async function hapusTerpilih(){
  const d = S.sesi.data, sesi = S.sesi, items = d.transaksi.filter(t => S.pilihTx.has(t.id));
  if (!items.length) return;
  d.transaksi = d.transaksi.filter(t => !S.pilihTx.has(t.id));
  let ubahB = false;
  items.forEach(t => { if (sinkronPakaiBersama({id:t.id}, true)) ubahB = true; });
  await simpanPribadi(); if (ubahB) await simpanBersama();
  S.pilihTx = null; tutupModal(); render();
  let batal = false;
  snack(items.length + " transaksi dihapus.", "Batalkan", async () => {
    if (S.sesi !== sesi) return;
    batal = true;
    const ada = new Set(sesi.data.transaksi.map(t => t.id));
    sesi.data.transaksi.push(...items.filter(t => !ada.has(t.id)));
    let ub = false;
    items.forEach(t => { if (sinkronPakaiBersama(t)) ub = true; });
    await simpanPribadi(); if (ub) await simpanBersama();
    render(); toast("Tupi mengembalikan " + items.length + " transaksi.");
  });
  /* foto struk baru benar-benar dihapus setelah waktu batal habis */
  setTimeout(() => { if (!batal) items.forEach(t => { if (t.fotoId) hapusFoto(t.fotoId).catch(() => {}); }); }, 11000);
}

const K_PUSH = id => PFX + "push." + id;
const pushDukung = () => DI_WEB && "serviceWorker" in navigator && "PushManager" in window && "Notification" in window;

function kunciVapid(s){
  const b = atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4));

}
function gabungKata(a){ return a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " dan " + a[a.length - 1]; }
/* jadwal kirim: H-3, H-2, H-1 sebelum jatuh tempo, pada jam pilihan. Hanya jumlah yang dikirim ke server. */
function hitungJadwalPush(){
  const d = S.sesi.data, hari = tglLokal(), batas = tambahHari(hari, 60), due = [];
  d.rutin.forEach(migrasiRutin);
  d.rutin.filter(r => r.aktif && r.mode === "ingatkan" && r.jenis !== "masuk" && !rutinSelesai(r))
    .forEach(r => jadwalRutin(r, batas).forEach(t => { if (t > hari && !r.dicatatTgl.includes(t)) due.push({t, j:"tagihan"}); }));
  d.utang.filter(u => u.jatuhTempo && sisaUtang(u) > 0 && u.jatuhTempo > hari && u.jatuhTempo <= batas)
    .forEach(u => due.push({t:u.jatuhTempo, j:u.jenis === "piutang" ? "piutang" : "tagihan"}));
  (d.bpjs || []).forEach(b => { const t = jatuhBpjs(b); if (t && t > hari && t <= batas) due.push({t, j:"tagihan"}); });
  kewajibanAset().forEach(x => { if (x.k.tgl > hari && x.k.tgl <= batas) due.push({t:x.k.tgl, j:"tagihan"}); });
  const per = new Map();
  due.forEach(x => [1, 2, 3].forEach(o => {
    const s = tambahHari(x.t, -o);
    if (s < hari) return;
    const m = per.get(s) || {};
    m[o] = m[o] || {tagihan:0, piutang:0}; m[o][x.j]++;
    per.set(s, m);
  }));
  const jam = pushJam(), label = {1:"besok", 2:"lusa", 3:"3 hari lagi"}, out = [];
  per.forEach((m, s) => {
    const waktu = new Date(s + "T" + jam + ":00");
    if (waktu.getTime() < Date.now() + 60000) return;
    const bagian = [];
    [1, 2, 3].forEach(o => {
      if (!m[o]) return;
      if (m[o].tagihan) bagian.push(m[o].tagihan + " tagihan " + label[o]);
      if (m[o].piutang) bagian.push(m[o].piutang + " piutang jatuh tempo " + label[o]);
    });
    out.push({waktu:waktu.toISOString(), judul:"Pipo: pengingat tagihan", isi:"Ada " + gabungKata(bagian) + ". Buka Dompet Kita untuk detailnya.", tag:"dompet-kita-tagihan"});
  });
  return out.sort((a, b) => a.waktu.localeCompare(b.waktu)).slice(0, 150);
}
async function langgananPush(paksaBaru){
  const reg = await navigator.serviceWorker.ready;
  let sub = await reg.pushManager.getSubscription();
  const vapid = await rpc("notif_vapid", {});
  if (!vapid) throw Object.assign(new Error("belum-siap"), {kode:"belum-siap"});
  if (sub && (paksaBaru || (sub.options && sub.options.applicationServerKey && keB64(sub.options.applicationServerKey) !== keB64(kunciVapid(vapid))))){
    try { await sub.unsubscribe(); } catch(e){}
    sub = null;
  }
  if (!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:kunciVapid(vapid)});
  return sub;
}
let timerPush = null;
function jadwalkanPush(){ clearTimeout(timerPush); timerPush = setTimeout(() => kirimJadwalPush(false), 4000); }
async function kirimJadwalPush(paksa, tambahan){
  if (!S.sesi || statusPush() !== "aktif") return false;
  const id = S.sesi.user.id, simpan = pushSaya(id);
  try {
    if (Notification.permission !== "granted") return false;
    const sub = await langgananPush(false), j = sub.toJSON(), jadwal = hitungJadwalPush().concat(tambahan || []);
    const sidik = kanon({e:j.endpoint, jadwal});
    if (!paksa && simpan.sidik === sidik && Date.now() - (simpan.kirim || 0) < 12 * 3600e3) return true;
    await rpc("notif_simpan", {p_rumah:awanCfg().rumah, p_perangkat:idPerangkatTetap(), p_profil:id, p_endpoint:j.endpoint, p_p256dh:j.keys.p256dh, p_auth:j.keys.auth, p_jadwal:jadwal});
    localStorage.setItem(K_PUSH(id), JSON.stringify(Object.assign(simpan, {aktif:true, sidik:tambahan ? "" : sidik, kirim:Date.now(), jumlah:jadwal.length})));
    return true;
  } catch(e){ console.warn("Jadwal notifikasi gagal:", e); return false; }
}

/* ============ Langkah 16 (v1.5.0): Obrolan dengan pasangan (Boo) ============ */
const K_OBROLAN = PFX + "obrolan";
const OB = {rows:new Map(), kursor:"", bacaLain:{}, bacaSaya:"", antre:[], cache:new Map(), muat:false, ketik:0, sql:true};
function obMuatLokal(){
  const r = bacaJson(K_OBROLAN) || {};
  OB.rows = new Map((r.rows || []).map(x => [x.id, x]));
  OB.kursor = r.kursor || ""; OB.bacaLain = r.bacaLain || {}; OB.bacaSaya = r.bacaSaya || {}; OB.antre = r.antre || [];
}
function obSimpanLokal(){
  const rows = [...OB.rows.values()].sort((a, b) => a.dibuat.localeCompare(b.dibuat)).slice(-800);
  localStorage.setItem(K_OBROLAN, JSON.stringify({rows, kursor:OB.kursor, bacaLain:OB.bacaLain, bacaSaya:OB.bacaSaya, antre:OB.antre}));
}

const obSiap = () => !!(S.sesi && S.sesi.kunciBersama && DI_WEB && awanTersambung() && obPasangan());
const obPasangan = () => S.sesi ? S.meta.pengguna.find(p => p.id !== S.sesi.user.id) : null;
const obBacaSaya = () => (S.sesi && OB.bacaSaya[S.sesi.user.id]) || "";
function obBelumDibaca(){
  if (!S.sesi) return 0;
  const me = S.sesi.user.id, batas = obBacaSaya();
  let n = 0;
  OB.rows.forEach(r => { if (r.dari !== me && !r.dihapus && r.dibuat > batas) n++; });

function obPerbaruiLencana(){
  const n = obBelumDibaca(), teks = n > 99 ? "99+" : String(n);

  document.querySelectorAll(".bn-ob").forEach(el => el.classList.toggle("ada", !!n));
}
async function obIsi(r){

/* ---------- Server: ambil, kirim, hapus, tanda dibaca ---------- */
async function obAmbil(){
  if (!obSiap() || OB.muat) return false;
  OB.muat = true;
  const rumah = awanCfg().rumah;
  try {
    let baru = false;
    for (let putaran = 0; putaran < 10; putaran++){
      const q = "/rest/v1/obrolan?select=id,dari,isi,dibuat,diubah,dihapus&rumah_id=eq." + encodeURIComponent(rumah) +
        (OB.kursor ? "&diubah=gt." + encodeURIComponent(new Date(Date.parse(OB.kursor) - 15000).toISOString()) : "") + "&order=diubah.asc&limit=500";
      const list = await awanFetch(q);
      list.forEach(r => { const lama = OB.rows.get(r.id); if (!lama || lama.diubah !== r.diubah){ OB.rows.set(r.id, r); OB.cache.delete(r.id); baru = true; } if (r.diubah > OB.kursor) OB.kursor = r.diubah; });
      if (list.length < 500) break;
    }
    const baca = await awanFetch("/rest/v1/obrolan_baca?select=profil,sampai&rumah_id=eq." + encodeURIComponent(rumah));
    baca.forEach(b => { if (S.sesi && b.profil !== S.sesi.user.id){ if (OB.bacaLain[b.profil] !== b.sampai){ OB.bacaLain[b.profil] = b.sampai; baru = true; } } });
    OB.sql = true;
    await obKirimAntre();
    obSimpanLokal();
    if (baru) obTampilkanUlang();
    obPerbaruiLencana();
    return baru;
  } catch(e){
    if (e.status === 404) OB.sql = false;
    return false;
  } finally { OB.muat = false; }
}
async function obKirimAntre(){
  if (!OB.antre.length || !obSiap()) return;
  const rumah = awanCfg().rumah, sisa = [];
  for (const a of OB.antre){
    try {
      const hasil = await awanFetch("/rest/v1/obrolan", {method:"POST", headers:{Prefer:"return=representation,resolution=ignore-duplicates"}, body:JSON.stringify({id:a.id, rumah_id:rumah, dari:a.dari, isi:a.isi})});
      const r = Array.isArray(hasil) && hasil[0];
      if (r) OB.rows.set(r.id, r);

    } catch(e){ if (e.status === 409) continue; sisa.push(a); }

let obTimerBaca = null;
function obTandaiDibaca(){
  if (!S.sesi || S.halaman !== "obrolan" || document.visibilityState !== "visible") return;
  const me = S.sesi.user.id;
  let akhir = obBacaSaya();
  OB.rows.forEach(r => { if (r.dari !== me && r.dibuat > akhir) akhir = r.dibuat; });
  if (!akhir || akhir === obBacaSaya()) return;
  OB.bacaSaya[me] = akhir; obSimpanLokal(); obPerbaruiLencana();
  clearTimeout(obTimerBaca);
  obTimerBaca = setTimeout(async () => {
    try {
      await awanFetch("/rest/v1/obrolan_baca", {method:"POST", headers:{Prefer:"resolution=merge-duplicates,return=minimal"}, body:JSON.stringify({rumah_id:awanCfg().rumah, profil:me, sampai:akhir})});
      siarkanOb("baca", {dari:me, sampai:akhir});
    } catch(e){}
  }, 600);
}

/* ---------- Realtime (Supabase Broadcast lewat WebSocket) ---------- */
const RT = {ws:null, ref:0, topik:"", siap:false, hb:null, coba:0, tunggu:0};
function kirimRT(m){
  if (!RT.ws || RT.ws.readyState !== 1) return;
  m.ref = String(++RT.ref);
  RT.ws.send(JSON.stringify(m));
}
async function rtSambung(){
  if (!obSiap() || (RT.ws && RT.ws.readyState <= 1) || !("WebSocket" in window) || Date.now() < RT.tunggu) return;
  RT.tunggu = Date.now() + 2000;
  const s = await sesiAwanValid();
  if (!s) return;
  RT.topik = "realtime:dompet-kita-" + awanCfg().rumah;
  let ws;
  try { ws = new WebSocket(AWAN.url.replace(/^http/, "ws") + "/realtime/v1/websocket?apikey=" + encodeURIComponent(AWAN.key) + "&vsn=1.0.0"); }
  catch(e){ return; }
  RT.ws = ws;
  ws.onopen = () => {
    RT.coba = 0;
    const ref = String(++RT.ref);
    ws.send(JSON.stringify({topic:RT.topik, event:"phx_join", ref, join_ref:ref,
      payload:{config:{broadcast:{self:false, ack:false}, presence:{key:""}, postgres_changes:[], private:false}, access_token:s.access_token}}));
    clearInterval(RT.hb);
    RT.hb = setInterval(() => kirimRT({topic:"phoenix", event:"heartbeat", payload:{}}), 25000);
  };
  ws.onmessage = e => {
    let m; try { m = JSON.parse(e.data); } catch(x){ return; }
    if (m.topic !== RT.topik) return;
    if (m.event === "phx_reply" && m.payload && m.payload.status === "ok") RT.siap = true;
    if (m.event === "broadcast" && m.payload) terimaSiaran(m.payload.event, m.payload.payload || {});
  };
  ws.onclose = () => {
    clearInterval(RT.hb); RT.siap = false; RT.ws = null;
    RT.coba++; RT.tunggu = Date.now() + Math.min(60000, 2000 * 2 ** Math.min(RT.coba, 5)) + Math.random() * 1000;
  };
  ws.onerror = () => { try { ws.close(); } catch(x){} };
}
function rtPutus(){ if (RT.ws){ const w = RT.ws; RT.ws = null; w.onclose = null; try { w.close(1000, "selesai"); } catch(e){} } clearInterval(RT.hb); RT.siap = false; }
function siarkanOb(event, payload){ if (RT.siap) kirimRT({topic:RT.topik, event:"broadcast", payload:{type:"broadcast", event, payload}}); }
function terimaSiaran(event, p){
  if (!S.sesi || p.dari === S.sesi.user.id) return;
  if (event === "pesan") obAmbil();
  else if (event === "baca"){ if (p.sampai && p.sampai > (OB.bacaLain[p.dari] || "")){ OB.bacaLain[p.dari] = p.sampai; obSimpanLokal(); obTampilkanUlang(); } }
  else if (event === "ketik"){ OB.ketik = Date.now(); obTampilKetik(); setTimeout(obTampilKetik, 4200); }
}
let obKetikTerakhir = 0;
function obSedangMengetik(){ if (Date.now() - obKetikTerakhir > 2500){ obKetikTerakhir = Date.now(); siarkanOb("ketik", {dari:S.sesi.user.id}); } }
function obTampilKetik(){
  const el = document.getElementById("ob-ketik");
  if (el) el.hidden = Date.now() - OB.ketik > 4000;
}
/* cadangan kalau realtime terputus: tanya server berkala */
setInterval(() => {
  if (!obSiap() || document.visibilityState !== "visible") return;
  rtSambung();
  const jeda = S.halaman === "obrolan" ? (RT.siap ? 15000 : 4000) : (RT.siap ? 60000 : 20000);
  if (Date.now() - (OB.ambilTerakhir || 0) >= jeda){ OB.ambilTerakhir = Date.now(); obAmbil(); }
}, 2000);
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && obSiap()){ rtSambung(); obAmbil(); obTandaiDibaca(); } });
addEventListener("online", () => { if (obSiap()){ rtSambung(); obAmbil(); } });
if ("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e => {
  const d = e.data || {};
  if (d.jenis === "obrolan-baru" && S.sesi) obAmbil();
  if (d.jenis === "buka" && (d.aksi === "obrolan" || d.aksi === "tagihan")){ S.aksiTunda = d.aksi; jalankanAksiTunda(); }
});

/* ---------- Kartu keuangan ---------- */
function kartuDariTagihan(id){ const x = S.sesi.bersama.bagiTagihan.find(b => b.id === id); return x ? {tipe:"tagihan", id, judul:x.judul, total:x.total} : null; }
function kartuDariAcara(id, bersama){
  const a = cariAcara(id, bersama);
  return a ? {tipe:"acara", id, bersama:!!bersama, nama:a.nama, anggaran:a.anggaran, terpakai:totalPakaiAcara(a, bersama), mulai:a.mulai, selesai:a.selesai} : null;
}
function kartuDariTx(id){
  const t = S.sesi.data.transaksi.find(x => x.id === id);
  if (!t) return null;
  const k = kat(t.kategoriId), w = dompetById(t.dompetId);
  return {tipe:"transaksi", id, jenis:t.jenis, judul:t.catatan || (k ? k.nama : "Transaksi"), kategori:k ? k.nama : (t.jenis === "pindah" ? "Pindah dompet" : ""), nominal:t.nominal, tanggal:t.tanggal, dompet:w ? w.nama : ""};
}
function kartuHTML(k){
  if (!k) return "";
  if (k.tipe === "tagihan"){
    const x = S.sesi.bersama.bagiTagihan.find(b => b.id === k.id);
    if (!x) return '<div class="ob-kartu"><span class="eyebrow">Bagi tagihan</span><strong>'+esc(k.judul)+'</strong><span class="muted">Tagihan ini sudah dihapus.</span></div>';
    return '<div class="ob-kartu">'+maskot("otto", 30)+'<div><span class="eyebrow">Bagi tagihan</span><strong>'+esc(x.judul)+' · '+rupiah(x.total)+'</strong>'+
      '<span class="muted">Dibayar '+esc(namaPengguna(x.bayarOleh))+' · '+(x.lunas ? "sudah lunas" : "belum lunas")+'</span>'+
      '<div class="row-btn" style="justify-content:flex-start">'+(x.lunas ? '' : tombolAksi("lunas-bagi", "Tandai lunas", "btn-primary btn-kecil", ' data-id="'+x.id+'"'))+tombolAksi("nav", "Lihat", "btn-ghost btn-kecil", ' data-h="bersama"')+'</div></div></div>';
  }
  if (k.tipe === "acara"){
    const a = k.bersama ? cariAcara(k.id, true) : null;
    const pakai = a ? totalPakaiAcara(a, true) : k.terpakai, ang = a ? a.anggaran : k.anggaran, nama = a ? a.nama : k.nama;
    return '<div class="ob-kartu">'+maskot("cici", 30)+'<div><span class="eyebrow">Anggaran acara'+(k.bersama ? " berdua" : "")+'</span><strong>'+esc(nama)+'</strong>'+
      '<span class="muted">Terpakai '+rupiah(pakai)+' dari '+rupiah(ang)+(a || k.bersama ? "" : " (saat dikirim)")+'</span>'+bar(ang ? Math.min(100, pakai / ang * 100) : 0, pakai > ang ? "#C4574B" : "#6F8F5E")+
      (k.bersama && a ? '<div class="row-btn" style="justify-content:flex-start">'+tombolAksi("rinci-acara", "Lihat rincian", "btn-ghost btn-kecil", ' data-id="'+a.id+'" data-b="1"')+'</div>' : '')+'</div></div>';
  }
  if (k.tipe === "transaksi"){
    const tanda = k.jenis === "masuk" ? "+" : k.jenis === "keluar" ? "−" : "";
    return '<div class="ob-kartu">'+maskot("tupi", 30)+'<div><span class="eyebrow">Transaksi</span><strong>'+esc(k.judul)+'</strong>'+
      '<span class="muted">'+esc([k.kategori, k.dompet, new Date(k.tanggal + "T00:00:00").toLocaleDateString("id-ID", {day:"numeric", month:"short", year:"numeric"})].filter(Boolean).join(" · "))+'</span>'+
      '<span class="ob-kartu-nominal '+(k.jenis === "masuk" ? "naik" : k.jenis === "keluar" ? "turun" : "")+'">'+tanda+rupiah(k.nominal)+'</span></div></div>';
  }
  return "";
}
function obLampirkan(k){
  if (!k){ toast("Data itu tidak ditemukan."); return; }
  tutupModal();
  S.obLampiran = k;
  if (S.halaman !== "obrolan"){ S.halaman = "obrolan"; render(); catatHalaman("obrolan"); } else obTampilkanUlang();
  const i = document.getElementById("ob-teks"); if (i) i.focus();
}

      : '<p class="muted">Belum ada tagihan bersama. Buat di halaman Bersama → Bagi tagihan.</p>';
  } else if (tab === "acara"){
    const list = acaraP().map(a => ({a, b:false})).concat(acaraB().map(a => ({a, b:true}))).sort((x, y) => y.a.mulai.localeCompare(x.a.mulai));
    isi = list.length ? list.map(x => '<button type="button" class="opsi-pulih" data-aksi="ob-pilih" data-k="acara" data-id="'+x.a.id+'" data-b="'+(x.b ? 1 : 0)+'">'+maskot("cici", 32)+'<span><strong>'+esc(x.a.nama)+(x.b ? " (berdua)" : "")+'</strong><span class="muted">'+rupiah(totalPakaiAcara(x.a, x.b))+' dari '+rupiah(x.a.anggaran)+'</span></span></button>').join("")
      : '<p class="muted">Belum ada anggaran acara.</p>';

    '<div class="seg-wrap">'+tb("tagihan", "Tagihan berdua")+tb("acara", "Acara")+tb("transaksi", "Transaksi")+'</div>'+
    '<div class="pilih-pulih ob-pilih-list">'+isi+'</div>', "modal-pulih");
}

/* ---------- Halaman Obrolan ---------- */
const fmtJamOb = iso => new Date(iso).toLocaleTimeString("id-ID", {hour:"2-digit", minute:"2-digit"});
function labelHariOb(iso){
  const d = new Date(iso), t = tglLokal(), k = tglLokal(d);
  if (k === t) return "Hari ini";
  if (k === tambahHari(t, -1)) return "Kemarin";
  return d.toLocaleDateString("id-ID", {weekday:"long", day:"numeric", month:"long", year:"numeric"});
}

let obRenderKe = 0;
async function obTampilkanUlang(keBawah){
  const wadah = document.getElementById("ob-daftar");
  obPerbaruiLencana();
  const lamp = document.getElementById("ob-lampiran");
  if (lamp) lamp.innerHTML = S.obLampiran ? '<div class="ob-lampiran">'+kartuHTML(S.obLampiran)+'<button type="button" class="x-kecil" data-aksi="ob-lepas" aria-label="Batalkan lampiran">&times;</button></div>' : "";
  if (!wadah || !S.sesi) return;
  const ke = ++obRenderKe, me = S.sesi.user.id;
  const dekatBawah = window.innerHeight + window.scrollY >= document.body.scrollHeight - 160;
  const antreIds = new Set(OB.antre.map(a => a.id));
  const semua = [...OB.rows.values()].concat(OB.antre.filter(a => !OB.rows.has(a.id)).map(a => Object.assign({antre:true}, a))).sort((a, b) => a.dibuat.localeCompare(b.dibuat));
  const isi = await Promise.all(semua.map(obIsi));
  if (ke !== obRenderKe) return;
  if (!semua.length){ wadah.innerHTML = '<div class="empty" style="padding:24px">'+maskot("boo", 96)+'<h2>Belum ada obrolan</h2><p class="muted">Mulai dengan sapa '+esc((obPasangan() || {}).nama || "pasanganmu")+'! Boo siap mengantar pesan kalian.</p></div>'; return; }
  const bacaLain = OB.bacaLain[(obPasangan() || {}).id] || "";
  let html = '<div class="ob-penjaga">'+maskot("boo", 30)+'<span>🔒 Boo menjaga obrolan kalian. Hanya kalian berdua yang bisa membacanya.</span></div>', hariLalu = "";
  semua.forEach((r, i) => {
    const v = isi[i], milik = r.dari === me, hari = labelHariOb(r.dibuat);
    if (hari !== hariLalu){ html += '<div class="ob-hari"><span>'+hari+'</span></div>'; hariLalu = hari; }
    let badan;
    if (v.jenis === "hapus") badan = '<span class="ob-dihapus">Pesan ini dihapus</span>';
    else if (v.jenis === "rusak") badan = '<span class="ob-dihapus">Pesan tidak bisa dibuka</span>';
    else badan = (v.kartu ? kartuHTML(v.kartu) : '') + (v.teks ? '<span class="ob-teks-isi">'+esc(v.teks).replace(/\n/g, "<br>")+'</span>' : '');
    const status = !milik ? "" : (r.antre || antreIds.has(r.id)) ? '<span class="ob-centang tunggu" title="Menunggu terkirim">◷</span>'
      : (bacaLain && r.dibuat <= bacaLain) ? '<span class="ob-centang dibaca" title="Dibaca">✓✓</span>' : '<span class="ob-centang" title="Terkirim">✓</span>';
    html += '<div class="ob-baris '+(milik ? "saya" : "dia")+'"><div class="ob-gelembung" '+(milik && v.jenis !== "hapus" && !r.antre ? 'data-aksi="ob-menu" data-id="'+r.id+'" tabindex="0"' : '')+'>'+badan+
      '<span class="ob-waktu">'+fmtJamOb(r.dibuat)+status+'</span></div>'+
      (milik && S.obMenu === r.id ? '<div class="ob-menu">'+tombolAksi("ob-hapus", "Hapus untuk semua", "btn-ghost btn-kecil btn-hapus", ' data-id="'+r.id+'"')+'</div>' : '')+'</div>';
  });
  wadah.innerHTML = html;
  const terakhir = semua.length ? semua[semua.length - 1].dibuat : "";
  if (keBawah || dekatBawah || !wadah.dataset.siap){ wadah.dataset.siap = "1"; S.obTerlihat = terakhir; requestAnimationFrame(() => scrollTo(0, document.body.scrollHeight)); }
  obPenunjukBaru(semua);
  obTandaiDibaca(); obTampilKetik();
}
function obPenunjukBaru(semua){
  const el = document.getElementById("ob-baru");
  if (!el || !S.sesi) return;
  const me = S.sesi.user.id;
  const n = (semua || [...OB.rows.values()]).filter(r => r.dari !== me && r.dibuat > (S.obTerlihat || "")).length;
  el.hidden = !n;
  if (n) el.querySelector("span").textContent = n + " pesan baru ↓";
}
addEventListener("scroll", () => {
  if (S.halaman !== "obrolan" || !document.getElementById("ob-baru")) return;
  if (window.innerHeight + window.scrollY >= document.body.scrollHeight - 160){
    const semua = [...OB.rows.values()];
    if (semua.length){ S.obTerlihat = semua.reduce((m, r) => r.dibuat > m ? r.dibuat : m, ""); obPenunjukBaru(); }
  }
}, {passive:true});
function pasangObrolan(){
  const t = document.getElementById("ob-teks");
  if (!t) return;
  const tinggi = () => { t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; };
  t.value = S.obDraf || "";
  tinggi();
  t.addEventListener("input", () => { S.obDraf = t.value; tinggi(); obSedangMengetik(); });
  t.addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey && !layarSentuh()){ e.preventDefault(); obKirimDariForm(); } });
  obTampilkanUlang(true);
  rtSambung(); obAmbil();
}
async function obKirimDariForm(){
  const t = document.getElementById("ob-teks"), teks = (t ? t.value : "").trim();
  if (!teks && !S.obLampiran) return;
  const isi = {jenis:S.obLampiran ? "kartu" : "teks", teks};
  if (S.obLampiran) isi.kartu = S.obLampiran;
  S.obLampiran = null; S.obDraf = "";
  if (t){ t.value = ""; t.style.height = "auto"; t.focus(); }
  await obKirim(isi);
}

  return '<button type="button" class="btn-kunci-hp btn-obrolan-hp" data-aksi="nav" data-h="obrolan" aria-label="Obrolan" title="Obrolan">'+maskot("boo", 30)+'<span class="ob-lencana" hidden></span></button>';
}

  "ob-kirim-acara": t => obLampirkan(kartuDariAcara(t.dataset.id, t.dataset.b === "1")),

});

function render(){
  const app = document.getElementById("app");
  pinAktif = null;
  if (S.layar === "sambutan"){ app.innerHTML = layarSambutan(); }
  else if (S.layar === "daftar"){ app.innerHTML = layarDaftar(); setelahRenderDaftar(); }
  else if (S.layar === "tanya-pasangan"){ app.innerHTML = layarTanyaPasangan(); }
  else if (S.layar === "login"){ app.innerHTML = layarLogin(); setelahRenderLogin(); }
  else if (S.layar === "app" && S.sesi){ app.innerHTML = layarApp(); setelahRenderApp(); }
  else { S.layar = "login"; render(); }
  if (["sambutan", "daftar", "tanya-pasangan"].includes(S.layar)) app.insertAdjacentHTML("afterbegin", '<div class="jam-pojok">'+maskot("owi", 32)+jamHTML()+'</div>');
  perbaruiJam();
}
function mulai(){
  if (!window.crypto || !crypto.subtle){
    document.getElementById("app").innerHTML = '<main class="center-screen"><div class="card welcome">'+maskot("niko", 100)+'<h1>Browser belum didukung</h1><p class="muted">Buka Dompet Kita dengan Google Chrome atau Microsoft Edge versi terbaru.</p></div></main>';
    return;
  }
  try { localStorage.setItem(PFX + "tes", "1"); localStorage.removeItem(PFX + "tes"); }
  catch(e){
    document.getElementById("app").innerHTML = '<main class="center-screen"><div class="card welcome">'+maskot("niko", 100)+'<h1>Penyimpanan diblokir</h1><p class="muted">Izinkan penyimpanan data situs di pengaturan browser, lalu muat ulang halaman ini.</p></div></main>';
    return;
  }
  cekVersiApp();
  S.meta = bacaJson(K_META);
  if (S.meta && S.meta.pengguna){
    let ubah = false;
    S.meta.pengguna.forEach(u => { if (ALIAS[u.avatar]){ u.avatar = ALIAS[u.avatar]; ubah = true; } });
    if (ubah) tulisJson(K_META, S.meta);
  }
  if (!S.meta || !S.meta.pengguna || !S.meta.pengguna.length){ S.layar = "sambutan"; }
  else { S.loginId = S.meta.pengguna[0].id; S.layar = "login"; }
  render();
}
mulai();
awanMulai();
</script>
